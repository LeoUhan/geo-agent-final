<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 智能体 · 可见性监测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal-900:#013a3e; --teal-800:#01545a; --teal:#01696F; --teal-600:#0b8189; --teal-100:#dcecec; --teal-050:#eef5f5;
  --cream:#F7F6F2; --white:#ffffff;
  --gold:#D19900; --gold-100:#faf0d6;
  --ink:#141a1a; --ink-70:#4b5757; --ink-50:#778484; --ink-30:#a9b3b3;
  --line:#e2e5e0; --line-2:#eef0ec;
  --ok:#1f7a4d; --ok-bg:#e6f4ec;
  --warn:#a76a00; --warn-bg:#fdf2dd;
  --risk:#a8321f; --risk-bg:#fbe9e5;
  --steel:#3f5d7a; --steel-bg:#e9eff5;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --sh-1:0 1px 2px rgba(20,26,26,.06);
  --sh-2:0 4px 14px rgba(20,26,26,.09);
  --f-ui:'Manrope','Noto Sans SC',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-ui);background:var(--cream);color:var(--ink);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input{font-family:inherit}
.app{display:flex;min-height:100vh}

/* ---- 侧边栏 ---- */
.sidebar{width:236px;flex-shrink:0;background:var(--teal-900);color:#e7f0ef;display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:9px;padding:16px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.sb-brand .logo{color:var(--gold);font-weight:800;font-size:15px}
.sb-brand .name{font-weight:700;font-size:13px}
.sb-brand .sub{font-size:10px;color:#7e9c9a;margin-top:1px}
.nav{padding:10px 10px;flex:1}
.nav .grp-title{font-size:10px;color:#7e9c9a;letter-spacing:.04em;padding:10px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:#c7dcda;font-size:12.5px;font-weight:500;cursor:default;margin-bottom:1px}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff}
.nav-item .ico{width:15px;text-align:center;opacity:.85}
.nav-sub{margin-left:24px;margin-top:2px;margin-bottom:6px}
.nav-sub .s-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:7px;font-size:12px;color:#9fbdba;cursor:pointer}
.nav-sub .s-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-sub .s-item.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.sb-foot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:#7e9c9a}

/* ---- 主区 ---- */
.main{flex:1;min-width:0;overflow-y:auto}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;background:var(--white);position:sticky;top:0;z-index:5}
.crumb{font-size:11px;color:var(--ink-50);letter-spacing:.02em}
.content{max-width:980px;margin:0 auto;padding:26px 30px 90px}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:6px;flex-wrap:wrap}
.pagehead h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
.pagehead .desc{font-size:12px;color:var(--ink-70);margin-top:5px;max-width:640px}

.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-50);cursor:pointer}
.seg button.on{background:var(--teal);color:#fff}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-1)}
.sec{margin-top:22px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-head h2{font-size:13.5px;margin:0;font-weight:700}
.sec-head .sub{font-size:11.5px;color:var(--ink-50)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge.teal{background:var(--teal-050);color:var(--teal)}
.badge.gold{background:var(--gold-100);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.risk{background:var(--risk-bg);color:var(--risk)}
.badge.grey{background:var(--line-2);color:var(--ink-50)}

.btn{font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;padding:7px 13px;border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--ink-30)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-800)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line)}
.inp{font-family:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--teal-600);border-radius:7px;outline:none;width:100%}
.inp:focus{box-shadow:0 0 0 3px var(--teal-050)}

.tiny{font-size:11px}
.muted{color:var(--ink-50)}
.linkbtn{color:var(--teal);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;font-size:inherit;padding:0}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-weight:700;color:var(--ink-50);font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.changed td{background:var(--gold-100)}
table.tbl tr.filtered-out{display:none}

.seg-sm{display:inline-flex;background:var(--line-2);border-radius:8px;padding:2px}
.seg-sm button{border:none;background:none;font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:6px;cursor:pointer;color:var(--ink-50)}
.seg-sm button.on{background:var(--white);color:var(--ink);box-shadow:var(--sh-1)}

.checkbox{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ink-30);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#fff;flex-shrink:0;background:#fff}
.checkbox.on{background:var(--teal);border-color:var(--teal)}
.checkbox.disabled{opacity:.4;cursor:not-allowed}

/* credibility banner */
.credbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--teal-100);border-radius:var(--r-lg);margin-bottom:24px;background:var(--teal-050)}
.credbar .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0}
.credbar b{font-size:12.5px}
.credbar .meta{color:var(--ink-70);font-size:12px}
.credbar .sep{width:1px;align-self:stretch;background:var(--teal-100)}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:12px 13px;border-radius:var(--r);border:1px solid var(--line)}
.kpi .lb{font-size:11.5px;color:var(--ink-50);font-weight:600}
.kpi .val{font-size:23px;font-weight:800;margin-top:4px;font-family:var(--f-mono)}
.kpi .delta{font-size:12px;font-weight:700;margin-left:6px}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.down{color:var(--risk)}
.kpi .abs{font-size:11px;color:var(--ink-50);margin-top:3px}
.kpi .def{font-size:10.5px;color:var(--ink-50);margin-top:7px;line-height:1.5}

.aux-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.aux-card{padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.aux-card .lb{font-size:11px;color:var(--ink-50);font-weight:600}
.aux-card .val{font-size:14px;font-weight:700;margin-top:3px}
.senti-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px}

.chart-wrap{margin-top:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink-70)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.legend .off{opacity:.3}

.heat-table{width:100%;border-collapse:collapse;font-size:11.5px}
.heat-table th{font-weight:700;color:var(--ink-50);text-align:center;padding:0 4px 8px;font-size:11px}
.heat-table th:first-child{text-align:left}
.heat-table td{text-align:center;padding:3px}
.heat-table td:first-child{text-align:left;font-weight:600;padding:6px 8px 6px 0;white-space:nowrap;font-size:12px}
.heat-cell{width:100%;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;font-weight:700;cursor:pointer;transition:transform .1s}
.heat-cell:hover{transform:scale(1.06)}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--gold-100);color:var(--warn);padding:5px 10px;border-radius:20px;font-size:11.5px;font-weight:700;margin-bottom:10px}
.filter-chip button{background:none;border:none;color:var(--warn);cursor:pointer;font-weight:800;font-family:inherit}

.hit{display:inline-flex;width:19px;height:19px;border-radius:5px;align-items:center;justify-content:center;font-size:9px;font-weight:800;margin-right:3px}
.hit.rec{background:var(--ok-bg);color:var(--ok)}
.hit.men{background:var(--gold-100);color:var(--warn)}
.hit.no{background:var(--line-2);color:var(--ink-30)}

.wizard{max-width:600px;margin:0 auto}
.steps-bar{display:flex;align-items:center;margin-bottom:26px}
.steps-bar .s{display:flex;align-items:center;flex:1}
.steps-bar .s .circ{width:24px;height:24px;border-radius:50%;background:var(--line-2);color:var(--ink-50);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.steps-bar .s.done .circ{background:var(--teal);color:#fff}
.steps-bar .s.now .circ{background:var(--ink);color:#fff}
.steps-bar .s .lb{font-size:11.5px;margin-left:8px;color:var(--ink-50);white-space:nowrap}
.steps-bar .s.now .lb,.steps-bar .s.done .lb{color:var(--ink);font-weight:700}
.steps-bar .rule{flex:1;height:1px;background:var(--line);margin:0 10px}
.steps-bar .rule.done{background:var(--teal)}
.wizcard h3{margin:0 0 4px;font-size:15.5px;font-weight:800}
.wizcard .desc{color:var(--ink-50);font-size:12px;margin-bottom:16px}
.field-row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2);gap:14px}
.field-row:last-child{border-bottom:none}
.field-row .k{font-size:12px;font-weight:700;min-width:110px;flex-shrink:0}
.field-row .v{font-size:12.5px;color:var(--ink-70);flex:1}
.field-row .src{margin-top:4px}
.persona-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;position:relative}
.persona-card.pending{border-color:var(--gold);background:var(--gold-100)}
.persona-card h4{margin:0 0 3px;font-size:12.5px;font-weight:700}
.persona-card .role{font-size:11px;color:var(--ink-50);margin-bottom:8px}
.wiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.wiz-warn{font-size:11.5px;color:var(--warn);font-weight:600}
.progress-wrap{text-align:center;padding:60px 20px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.pending-strip{display:flex;align-items:center;gap:12px;padding:11px 15px;margin-bottom:18px;border:1px solid var(--gold);background:var(--gold-100);border-radius:var(--r-lg)}
.pending-strip b{font-weight:800}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
.drawer-mask{position:fixed;inset:0;background:rgba(10,10,8,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-440px;width:420px;max-width:90vw;height:100%;background:var(--white);box-shadow:-12px 0 40px rgba(0,0,0,.1);transition:right .25s cubic-bezier(.2,.8,.3,1);z-index:41;overflow-y:auto;padding:24px}
.drawer.show{right:0}
.drawer h3{margin:0 0 4px;font-size:15px;font-weight:800}
.drawer .close{position:absolute;top:20px;right:20px;cursor:pointer;color:var(--ink-50);font-size:16px;background:none;border:none}
.answer-block{background:var(--cream);border-radius:var(--r);padding:12px 13px;margin-top:10px;font-size:12px;line-height:1.7;border:1px solid var(--line-2)}
.answer-block mark{background:var(--gold-100);padding:0 2px;border-radius:2px}
.demo-toggle{padding:10px 14px;border:1px dashed var(--ink-30);border-radius:var(--r);margin-bottom:20px;font-size:11px;color:var(--ink-50);background:var(--white)}
.identity-bar{display:flex;align-items:center;gap:10px;padding:9px 26px;background:var(--teal-900);color:#cfe4e2;font-size:11.5px}
.identity-bar b{color:#fff}
.identity-bar .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.identity-bar .seg button{color:#cfe4e2}
.identity-bar .seg button.on{background:var(--gold);color:#3a2a00}
.ops-item{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;background:var(--white)}
.ops-item textarea{width:100%;font-family:inherit;font-size:12.5px;line-height:1.6;border:1px solid var(--teal-600);border-radius:8px;padding:10px 12px;resize:vertical;min-height:80px;margin-top:10px}
.ops-empty{text-align:center;padding:50px 20px;color:var(--ink-50);font-size:12.5px}

/* ---- 工作项确认卡（周期性产出，需要终审） ---- */
.workhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.workhead h2{font-size:13.5px;margin:0;font-weight:800}
.workhead .cnt{font-size:11.5px;color:var(--warn);font-weight:700}
.workhead .done{font-size:11.5px;color:var(--ok);font-weight:700}
.workcard{border:1px solid var(--gold);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;background:var(--white)}
.workcard.resolved{border-color:var(--line);opacity:.7}
.workcard-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.workcard-tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wtitle{font-size:13px;font-weight:700;margin-top:4px}
.wowner{font-size:11px;color:var(--ink-50);margin-top:3px;display:flex;align-items:center;gap:6px}
.wowner .av{width:16px;height:16px;border-radius:50%;background:var(--teal);color:#fff;font-size:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.wowner .reviewed{background:var(--teal-050);color:var(--teal-800);font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px}
.wblock{background:var(--cream);border-radius:var(--r);padding:11px 13px;font-size:12.5px;line-height:1.65;margin-top:12px}
.wblock .wlb{font-size:10.5px;font-weight:800;color:var(--teal);margin-bottom:5px}

/* ---- 轨迹（谁经手过） ---- */
.wtrack{margin-top:12px}
.wt-node{display:flex;gap:10px;position:relative;padding-bottom:10px}
.wt-node:last-child{padding-bottom:0}
.wt-node:not(:last-child)::before{content:'';position:absolute;left:5px;top:16px;bottom:-4px;width:1px;background:var(--line)}
.wt-dot{width:11px;height:11px;border-radius:50%;background:var(--teal);flex-shrink:0;margin-top:3px;position:relative;z-index:1}
.wt-dot.ops{background:var(--gold)}
.wt-who{font-size:12px;font-weight:700}
.wt-who .tag{font-size:10px;font-weight:700;color:var(--teal-800);background:var(--teal-050);padding:1px 7px;border-radius:20px;margin-left:6px}
.wt-note{font-size:11.5px;color:var(--ink-50);margin-top:2px}
.wneed{font-size:11.5px;color:var(--ink-70);margin-top:10px}
.wact{margin-top:8px;display:flex;gap:8px;align-items:center}
.fb-box{margin-top:10px}
.fb-box textarea{width:100%;font-family:inherit;font-size:12.5px;border:1px solid var(--teal-600);border-radius:8px;padding:8px 10px;resize:vertical;min-height:56px}

/* ---- 主题 chips ---- */
.topic-chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-050);color:var(--teal-800);border:1px solid var(--teal-100);border-radius:20px;padding:4px 10px 4px 12px;font-size:12px;font-weight:600;cursor:pointer}
.topic-chip.pending{background:var(--gold-100);color:var(--warn);border-color:var(--gold)}
.topic-chip .x{opacity:.7;font-size:10px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-brand"><span class="logo">◈</span><div><div class="name">独立站超级智能体</div><div class="sub">统一后台框架</div></div></div>
    <nav class="nav">
      <div class="grp-title">GEO 智能体</div>
      <div class="nav-item active"><span class="ico">✳</span>GEO 智能体</div>
      <div class="nav-sub">
        <div class="s-item">概览</div>
        <div class="s-item on">可见性监测</div>
        <div class="s-item">诊断与策略</div>
        <div class="s-item">优化中心</div>
        <div class="s-item">报告与设置</div>
      </div>
    </nav>
    <div class="sb-foot">框架级 DEMO · 交互原型 v3</div>
  </aside>
  <div class="main">
    <div class="identity-bar" id="identityBar"></div>
    <div class="topbar"><span class="crumb">GEO 智能体 / 可见性监测</span></div>
    <div class="content" id="main"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="drawer-mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
/* ============ 状态（真实可变） ============ */
const KPIS = [
  {id:'mention', zh:'被提及率', v:42, base:28, prev:38, moe:2.8, hex:'#01696F', def:'买家问AI时，回答里提到我们的比例'},
  {id:'rec', zh:'被推荐率', v:28, base:15, prev:24, moe:2.8, hex:'#a76a00', def:'提到我们时，是否作为推荐/比较对象'},
  {id:'cite', zh:'被引用率', v:17, base:9, prev:15, moe:2.8, hex:'#3f5d7a', def:'AI把官网当信息来源（给链接或具名）的比例'},
  {id:'sov', zh:'声量份额', v:27, base:17, prev:23, moe:2.8, hex:'#a8321f', def:'同一批问题中，我方占所有品牌被提及的比例'}
];
const TREND = {
  weeks:['W-6','W-5','W-4','W-3','W-2','W-1','本周'],
  mention:[36,36,37,39,37,39,42], rec:[24,25,25,26,25,26,28], cite:[13,14,14,15,14,15,17], sov:[22,22,23,24,22,24,27]
};
const AUX = { pos:{v:'2.3', prev:'3.1'}, senti:{pos:71,neu:24,neg:5,fir:7} };

let personas = [
  {id:'p1', name:'复材加工厂技术负责人', mkt:'DE', st:'ok'},
  {id:'p2', name:'航空零部件采购经理', mkt:'US', st:'ok'},
  {id:'p3', name:'精密加工车间主管', mkt:'US', st:'ok'},
  {id:'p4', name:'日本商社设备采购担当', mkt:'JP', st:'ok'},
  {id:'p6', name:'汽车 Tier-1 工艺工程师', mkt:'DE', st:'pending'}
];
let topics = [
  {id:'t1', name:'碳纤维/复材切割', st:'ok', origIndex:0},

function lineChart(){
  const w=740,ht=176,padL=8,padR=8,padT=14,padB=22;
  const weeks=TREND.weeks;
  const maxV=50;
  const x=i=>padL+i*((w-padL-padR)/(weeks.length-1));
  const y=v=>ht-padB-(v/maxV)*(ht-padT-padB);
  let svg=`<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;overflow:visible">`;
  for(let g=0;g<=3;g++){const gy=padT+g*((ht-padT-padB)/3);svg+=`<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#eef0ec" stroke-width="1"/>`;}
  KPIS.forEach(k=>{
    const el=document.getElementById('leg-'+k.id);
    if(el && el.dataset.off==='1') return;
    const data=TREND[k.id];
    const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg+=`<polyline points="${pts}" fill="none" stroke="${k.hex}" stroke-width="${k.id==='mention'?2.6:1.7}" stroke-linejoin="round" stroke-linecap="round"/>`;
    data.forEach((v,i)=>svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${k.hex}"/>`);
  });
  weeks.forEach((wl,i)=>svg+=`<text x="${x(i)}" y="${ht-4}" font-size="10" fill="#778484" text-anchor="middle" font-family="Manrope">${wl}</text>`);
  svg+='</svg>';
  return svg;
}

    </div>
    ${w.status==='client_pending'? `<div class="wneed"><b>需要你：</b>${w.need}</div>
    <div class="wact"><button class="btn sm primary" onclick="${w.pid?`confirmPersonaWork('${w.id}')`:`confirmWorkItem('${w.id}')`}">✓ 确认</button>${w.pid?'':`<button class="btn sm" onclick="toggleFeedbackBox('${w.id}')">提修改意见</button>`}<button class="btn sm" onclick="openWorkDetail('${w.id}')">查看详情 →</button></div>
    ${w.pid?'':`<div class="fb-box" id="fb-${w.id}" style="display:none"><textarea id="fbtext-${w.id}" placeholder="写下你的修改意见，GEO智能体将据此调整"></textarea><div style="margin-top:6px"><button class="btn sm primary" onclick="submitFeedback('${w.id}')">提交意见</button> <button class="btn sm" onclick="toggleFeedbackBox('${w.id}')">取消</button></div></div>`}`
    : `<div class="tiny muted" style="margin-top:10px">${w.feedback? '你的意见：'+w.feedback : '已确认'}</div>`}
  </div>`;
  return `<div class="sec">
  <div class="demo-toggle">演示切换（实际由客户是否购买代运营服务决定，非用户可切换项）：
    <button class="btn sm ${SVC_MODE==='self'?'primary':''}" onclick="setSvcMode('self')" style="margin-left:6px">自助模式</button>
    <button class="btn sm ${SVC_MODE==='managed'?'primary':''}" onclick="setSvcMode('managed')">代运营模式</button>
    <button class="btn sm" style="margin-left:10px" onclick="simulateNewWork()">模拟：Agent产出新工作</button>
    <span style="margin-left:8px">${SVC_MODE==='managed'?'代运营模式下，Agent产出先给运营顾问处理（切到"运营顾问"身份查看，是同一个页面），提交后客户才会看到':'自助模式下没有运营处理这一步，Agent产出直接进入客户待确认'}</span>
  </div>
  <div class="workhead"><h2>本期工作与待确认</h2>${pending.length?`<span class="cnt">待你确认 · ${pending.length}件</span>`:`<span class="done">已全部处理</span>`}</div>
  ${pending.map(card).join('')}
  ${resolved.length && pending.length===0 ? resolved.map(card).join('') : ''}

  </div>`;
}
function setSvcMode(m){SVC_MODE=m;render();}
function setIdentity(id){IDENTITY=id; VIEW='result'; render();}
function confirmWorkItem(id){ const w=workItems.find(x=>x.id===id); w.status='confirmed'; render(); toast('已确认「'+w.kind+'」'); }
function toggleFeedbackBox(id){ const el=document.getElementById('fb-'+id); if(el) el.style.display = el.style.display==='none'?'block':'none'; }
function submitFeedback(id){
  const w=workItems.find(x=>x.id===id); const val=document.getElementById('fbtext-'+id).value.trim();
  if(!val){ toast('请先写点意见'); return; }
  w.feedback=val; w.status='confirmed'; render(); toast('意见已记录，GEO智能体将据此调整');
}
function openWorkDetail(id){
  const w=workItems.find(x=>x.id===id);
  openDrawer(`<button class="close" onclick="closeDrawer()">✕</button>
  <h3>${w.kind}</h3><div class="tiny muted" style="margin-bottom:14px">${w.title}</div>
  <div class="wblock"><div class="wlb">结论与依据</div>${w.body}</div>
  ${w.pid? personaChecklist(w) : ''}
  <div class="tiny muted" style="margin-top:14px">${w.need}</div>
  <div style="margin-top:16px"><button class="btn sm primary" onclick="${w.pid?`confirmPersonaWork('${w.id}');closeDrawer()`:`confirmWorkItem('${w.id}');closeDrawer()`}">✓ 确认</button></div>`);
}

function resultView(){
  return credBar()
  + workItemsBlock()
  + `<div class="sec"><div class="sec-head"><h2>GEO效果 · IAB 四主指标</h2><span class="sub">先看变化量，再看绝对值</span></div><div class="card">${kpiBlock()}</div></div>`
  + `<div class="sec"><div class="sec-head"><h2>人设 × ${HEAT_METRIC==='topic'?'主题':'市场'} 热力图</h2><span class="sub">按维度查看被提及率数值</span></div><div class="card">${heatmap()}</div></div>`
  + `<div class="sec" id="sec-prompts"><div class="sec-head"><h2>提问级结果</h2><span class="sub">默认只显示本期有变化的提问</span></div><div class="card">${promptsTable()}</div></div>`
  + `<div class="sec"><div class="sec-head"><h2>来源图谱</h2><span class="sub">谁在影响行业AI回答</span></div><div class="card">${sourceTable()}</div></div>`;
}

/* ============ 配置视图 ============ */
function configView(){
  return `<div class="demo-toggle">演示切换（实际由是否已有监测数据自动判定）：
    <button class="btn sm ${CFG_MODE==='first'?'primary':''}" onclick="setCfgMode('first')" style="margin-left:6px">新工作区 · 首次引导</button>
    <button class="btn sm ${CFG_MODE==='edit'?'primary':''}" onclick="setCfgMode('edit')">已配置 · 自由编辑</button></div>`
  + (CFG_MODE==='first'? wizardView() : editView());
}
function setCfgMode(m){CFG_MODE=m;WIZ_STEP=1;WIZ_SAMPLING=false;render();}

const WIZ_TITLES=['输入底座','买家人设','提问库','监测计划'];
function wizValid(step){
  if(step===1) return inputs.slice(0,3).every(x=>x.v && x.v.trim());
  if(step===2) return personas.some(p=>p.st==='ok');
  if(step===3) return promptLib.some(p=>p.st==='ok');
  return true;
}
function wizardView(){
  if(WIZ_SAMPLING){
    return `<div class="wizard"><div class="card progress-wrap"><div class="spin"></div>
      <div style="font-size:15px;font-weight:800">首次采样进行中</div>
      <div class="tiny muted" style="margin-top:8px">预计 20–40 分钟，关闭页面不影响进度，完成后在概览查看提醒</div>
      <button class="btn sm" style="margin-top:20px" onclick="finishSampling()">（演示）立即查看结果</button>
    </div></div>`;
  }
  const stepsBar = `<div class="steps-bar">${WIZ_TITLES.map((t,i)=>{
    const n=i+1, st = n<WIZ_STEP?'done':n===WIZ_STEP?'now':'';
    return `<div class="s ${st}"><div class="circ">${n<WIZ_STEP?'✓':n}</div><div class="lb">${t}</div></div>${i<3?`<div class="rule ${n<WIZ_STEP?'done':''}"></div>`:''}`;
  }).join('')}</div>`;

  let body='';
  if(WIZ_STEP===1){
    body = `<h3>确认输入底座</h3><div class="desc">已从企业知识库继承、官网扫描预填，请确认或编辑</div>
    ${inputs.slice(0,5).map(x=>fieldRow(x,'wiz')).join('')}
    ${topicsBlock()}
    <div class="tiny muted" style="margin-top:16px">品牌、产品线、目标市场为必填；竞对、事实、主题可留空或待确认，之后在监测配置中补充</div>`;
  } else if(WIZ_STEP===2){
    body = `<h3>确认买家人设</h3><div class="desc">AI基于输入底座生成的人设，至少确认1个才能继续</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${personas.map(personaCard).join('')}</div>
    <div style="margin-top:14px"><button class="btn sm" onclick="addPersona()">＋ 新增人设</button></div>`;
  } else if(WIZ_STEP===3){
    body = `<h3>确认提问库</h3><div class="desc">按人设与主题生成，证据不足2项的默认不勾选</div>
    <table class="tbl"><thead><tr><th style="width:24px"></th><th>提问</th><th>证据</th><th>状态</th></tr></thead><tbody>
    ${promptLib.map((p,i)=>`<tr><td><span class="checkbox ${p.st==='ok'?'on':''}" onclick="togglePromptLib(${i})">${p.st==='ok'?'✓':''}</span></td><td style="font-weight:600">${p.q}</td>
      <td class="mono">${p.ev}/4</td><td>${p.st==='ok'?'<span class="badge ok">已入库</span>':'<span class="badge gold">待确认</span>'}</td></tr>`).join('')}
    </tbody></table>
    <div style="margin-top:14px"><button class="btn sm" onclick="addPrompt()">＋ 手动新增</button></div>`;
  } else if(WIZ_STEP===4){
    const cnt = promptLib.filter(p=>p.st==='ok').length;
    body = `<h3>确认监测计划</h3><div class="desc">本次将执行的监测范围，由套餐档位决定上限</div>
    <div class="field-row"><div class="k">监测提问</div><div class="v">${cnt} 条（当前已确认数）</div></div>
    <div class="field-row"><div class="k">AI引擎</div><div class="v">Google 系 3 引擎（入门版）</div></div>
    <div class="field-row"><div class="k">监测频率</div><div class="v">每周，哨兵快照每日</div></div>
    <div class="field-row"><div class="k">首次全景审计</div><div class="v">确认后立即启动</div></div>`;
  }

  const valid = wizValid(WIZ_STEP);
  const warnMap={1:'品牌/产品线/目标市场不能为空',2:'至少确认1个人设才能继续',3:'至少确认1条提问才能继续'};
  return `<div class="wizard">${stepsBar}<div class="card wizcard">${body}
    <div class="wiz-foot">
      <button class="btn" ${WIZ_STEP===1?'disabled':''} onclick="wizBack()">上一步</button>
      ${!valid?`<span class="wiz-warn">${warnMap[WIZ_STEP]}</span>`:''}
      <button class="btn primary" ${!valid?'disabled':''} onclick="wizNext()">${WIZ_STEP<4?'下一步':'确认并启动首次监测'}</button>
    </div></div></div>`;
}
function fieldRow(x,ctx){
  const editing = EDIT_KEY===ctx+':'+x.k;
  return `<div class="field-row"><div class="k">${x.k}</div>
    <div class="v">${editing?`<input class="inp" id="ef-${esc(x.k)}" value="${x.v.replace(/"/g,'&quot;')}"><div style="margin-top:6px"><button class="btn sm primary" onclick="saveField('${esc(x.k)}','${ctx}')">保存</button> <button class="btn sm" onclick="cancelEdit()">取消</button></div>`:x.v}
      ${!editing?`<div class="src"><span class="badge grey">${x.src}</span>${x.st==='pending'?' <span class=\"badge gold\">待确认</span>':''}</div>`:''}
    </div>
    ${!editing?`<div style="white-space:nowrap">${x.st==='pending'?`<button class="btn sm primary" onclick="confirmInput('${esc(x.k)}')">确认</button> `:''}<button class="btn sm" onclick="startEdit('${esc(x.k)}','${ctx}')">编辑</button></div>`:''}
  </div>`;
}
function startEdit(k,ctx){EDIT_KEY=ctx+':'+k;render();setTimeout(()=>{const el=document.getElementById('ef-'+k);if(el){el.focus();el.select();}},0);}
function cancelEdit(){EDIT_KEY=null;render();}
function saveField(k,ctx){
  const el=document.getElementById('ef-'+k); const val=el.value;
  const item = inputs.find(x=>x.k===k);
  const doSave=()=>{ item.v=val; item.st='ok'; EDIT_KEY=null; render(); toast('已保存「'+k+'」'); };
  if(item.sensitive){
    if(confirm('修改「'+k+'」会导致下游相关提问与历史基线重新计算，历史数据将不可直接比较。确认保存吗？')) doSave();
  } else { doSave(); }
}
function confirmInput(k){
  const item = inputs.find(x=>x.k===k); item.st='ok'; render();
  toast('已采纳「'+k+'」，下次全景审计重算基线并标注');
}
function personaCard(p){
  return `<div class="persona-card ${p.st==='pending'?'pending':''}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <h4>${p.name}</h4>
      <span class="checkbox ${p.st==='ok'?'on':''}" onclick="togglePersona('${p.id}')">${p.st==='ok'?'✓':''}</span>
    </div>
    <div class="role">${p.mkt} 市场${p.st==='pending'?' · AI生成，待确认':''}</div>
    <button class="btn sm" onclick="editPersona('${p.id}')">编辑</button>
  </div>`;
}
function togglePersona(id){const p=personas.find(x=>x.id===id); p.st = p.st==='ok'?'pending':'ok'; render();}
function editPersona(id){
  const p=personas.find(x=>x.id===id);
  const val = prompt('编辑人设名称', p.name);
  if(val!==null && val.trim()){ p.name=val.trim(); render(); toast('已更新人设名称'); }
}
function addPersona(){
  const val = prompt('新人设名称（例如：德国采购经理）'); if(!val || !val.trim()) return;
  const mkt = prompt('对应市场（如 DE / US / JP）','US') || 'US';
  personas.push({id:'p'+Date.now(), name:val.trim(), mkt:mkt.trim().toUpperCase(), st:'pending'});
  render(); toast('已新增人设，待确认');
}
function topicsBlock(){
  return `<div class="field-row"><div class="k">主题（品类话题）</div>
    <div class="v">${topics.map(t=>`<span class="topic-chip ${t.st==='pending'?'pending':''}" onclick="toggleTopic('${t.id}')" title="${t.st==='pending'?'AI新识别，点击确认':'点击可取消确认'}">${t.name}${t.st==='pending'?' · 待确认':''} <span class="x">${t.st==='pending'?'✓':'✕'}</span></span>`).join(' ')}
      <div class="src" style="margin-top:8px"><span class="badge grey">AI识别（产品线×人设决策因子生成）</span></div>
    </div>
    <div><button class="btn sm" onclick="addTopic()">＋ 新增主题</button></div>
  </div>`;
}
function toggleTopic(id){ const t=topics.find(x=>x.id===id); t.st = t.st==='ok'?'pending':'ok'; render(); toast(t.st==='ok'?'已确认主题「'+t.name+'」，下次全景审计纳入热力图':'已取消确认，暂不进入热力图'); }
function addTopic(){
  const val = prompt('新主题名称（品类话题）'); if(!val || !val.trim()) return;
  topics.push({id:'t'+Date.now(), name:val.trim(), st:'pending', origIndex:null});
  render(); toast('已新增主题，待确认，确认后下次全景审计生效');
}
function togglePromptLib(i){ const p=promptLib[i]; p.st = p.st==='ok'?'pending':'ok'; render(); }
function addPrompt(){
  const q = prompt('新提问内容'); if(!q || !q.trim()) return;
  promptLib.push({q:q.trim(), pid:personas[0]?personas[0].id:'', ev:1, st:'pending'});
  render(); toast('已新增提问，证据不足2项，需手动确认');
}

function wizNext(){ if(!wizValid(WIZ_STEP)) return; if(WIZ_STEP<4){WIZ_STEP++;render();} else {WIZ_SAMPLING=true;render();} }
function wizBack(){ if(WIZ_STEP>1){WIZ_STEP--;render();} }
function finishSampling(){ WIZ_SAMPLING=false; CFG_MODE='edit'; VIEW='result'; render(); toast('首次监测完成，已生成监测结果'); }

function editView(){
  const pendingInputs = inputs.filter(x=>x.st==='pending').length + topics.filter(t=>t.st==='pending').length;
  const pendingPersonas = personas.filter(p=>p.st==='pending').length;
  const pendingPrompts = promptLib.filter(p=>p.st==='pending').length;
  const pendingCount = pendingInputs+pendingPersonas+pendingPrompts;
  const parts=[];
  if(pendingInputs) parts.push(pendingInputs+'项输入/主题');
  if(pendingPersonas) parts.push(pendingPersonas+'个人设');
  if(pendingPrompts) parts.push(pendingPrompts+'条提问');
  const pendingStrip = pendingCount? `<div class="pending-strip">
    <span style="flex:1"><b>${pendingCount} 项待确认</b> — ${parts.join('、')}</span>
    <button class="btn sm primary" onclick="jumpFirstPending()">逐项处理</button></div>` : '';

  const tabs = `<div class="seg-sm" style="margin-bottom:18px">
    <button class="${CFG_TAB==='inputs'?'on':''}" onclick="setCfgTab('inputs')">输入底座${pendingInputs?` (${pendingInputs})`:''}</button>
    <button class="${CFG_TAB==='personas'?'on':''}" onclick="setCfgTab('personas')">买家人设${pendingPersonas?` (${pendingPersonas})`:''}</button>
    <button class="${CFG_TAB==='prompts'?'on':''}" onclick="setCfgTab('prompts')">提问库${pendingPrompts?` (${pendingPrompts})`:''}</button>
  </div>`;

  let body='';
  if(CFG_TAB==='inputs'){
    body = inputs.map(x=>fieldRow(x,'edit')).join('')
    + topicsBlock()
    + `<div class="tiny muted" style="margin-top:14px">修改竞对名单或品牌别名会重算下游基线，历史数据不可比，保存前会二次确认影响范围</div>`;
  } else if(CFG_TAB==='personas'){
    body = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${personas.map(personaCard).join('')}</div>
    <div style="margin-top:14px"><button class="btn sm" onclick="addPersona()">＋ AI生成新人设</button></div>`;
  } else {
    body = `<table class="tbl"><thead><tr><th style="width:24px"></th><th>提问</th><th>人设</th><th>证据</th><th>状态</th></tr></thead><tbody>
    ${promptLib.map((p,i)=>`<tr class="${p.st==='pending'?'changed':''}"><td><span class="checkbox ${p.st==='ok'?'on':''}" onclick="togglePromptLib(${i})">${p.st==='ok'?'✓':''}</span></td><td style="font-weight:600">${p.q}</td><td class="tiny">${(personas.find(x=>x.id===p.pid)||{}).name||''}</td>
      <td class="mono">${p.ev}/4</td><td>${p.st==='ok'?'<span class="badge ok">已入库</span>':'<span class="badge gold">待确认</span>'}</td></tr>`).join('')}
    </tbody></table>
    <div style="margin-top:14px"><button class="btn sm" onclick="addPrompt()">＋ 手动新增</button></div>`;
  }
  return pendingStrip + tabs + `<div class="card">${body}</div>`;
}
function setCfgTab(t){CFG_TAB=t;render();}
function jumpFirstPending(){
  if(inputs.some(x=>x.st==='pending')) setCfgTab('inputs');
  else if(personas.some(p=>p.st==='pending')) setCfgTab('personas');
  else setCfgTab('prompts');
}

function opsWorkItemsBlock(){
  const drafts = workItems.filter(w=>w.status==='draft');
  const submitted = workItems.filter(w=>w.status!=='draft');
  const draftCard = w => `<div class="workcard">
    <div class="workcard-top">
      <div>
        <div class="workcard-tags"><span class="badge teal">监测/跟踪</span><span class="badge grey">${w.kind}</span></div>
        <div class="wtitle">${w.title}</div>
        <div class="wowner"><span class="av">G</span>GEO 智能体原始产出 · 客户尚不可见</div>
      </div>
      <span class="badge gold">待你处理</span>
    </div>
    <div class="wblock"><div class="wlb">结论与依据（可编辑）</div><textarea id="opsbody-${w.id}" style="width:100%;font-family:inherit;font-size:12.5px;line-height:1.65;border:1px solid var(--teal-600);border-radius:8px;padding:10px 12px;resize:vertical;min-height:76px;margin-top:6px">${w.body}</textarea></div>
    <div class="wact"><button class="btn sm primary" onclick="submitToClient('${w.id}')">提交给客户确认 →</button></div>
  </div>`;
  const doneCard = w => `<div class="workcard resolved">
    <div class="workcard-top">
      <div>
        <div class="workcard-tags"><span class="badge teal">监测/跟踪</span><span class="badge grey">${w.kind}</span></div>
        <div class="wtitle">${w.title}</div>
        <div class="wowner"><span class="av">G</span>GEO 智能体 <span class="reviewed">已复核</span></div>
      </div>
      <span class="badge grey">${w.status==='confirmed'?'客户已确认':'已提交客户，待客户确认'}</span>
    </div>
    <div class="wblock"><div class="wlb">结论与依据</div>${w.body}</div>
  </div>`;
  return `<div class="sec">
  <div class="demo-toggle">演示切换（实际由客户是否购买代运营服务决定，非用户可切换项）：
    <button class="btn sm ${SVC_MODE==='self'?'primary':''}" onclick="setSvcMode('self')" style="margin-left:6px">自助模式</button>
    <button class="btn sm ${SVC_MODE==='managed'?'primary':''}" onclick="setSvcMode('managed')">代运营模式</button>
    <button class="btn sm" style="margin-left:10px" onclick="simulateNewWork()">模拟：Agent产出新工作</button>
  </div>
  <div class="workhead"><h2>本期工作与待处理</h2>${drafts.length?`<span class="cnt">待你处理 · ${drafts.length}件</span>`:`<span class="done">暂无待处理草稿</span>`}</div>
  ${SVC_MODE==='self'? `<div class="card" style="text-align:center;padding:30px;color:var(--ink-50);font-size:12.5px">该客户当前为自助模式，Agent产出直接进客户账号，没有运营处理这一步。</div>`
    : drafts.map(draftCard).join('') + (submitted.length? submitted.map(doneCard).join('') : '')}
  </div>`;
}
function submitToClient(id){
  const w=workItems.find(x=>x.id===id);
  const edited = document.getElementById('opsbody-'+id).value;
  w.body = edited; w.status='client_pending'; w.reviewed=true; w.due='今天';
  render();
  toast('已提交给客户确认');
}

function setView(v){VIEW=v;render();}
function renderIdentityBar(){
  document.getElementById('identityBar').innerHTML = `身份（演示切换，实际由登录账号决定）：
    <span class="seg" style="margin-left:4px">
      <button class="${IDENTITY==='customer'?'on':''}" onclick="setIdentity('customer')">客户</button>
      <button class="${IDENTITY==='ops'?'on':''}" onclick="setIdentity('ops')">运营顾问</button>
    </span>`;
}
function render(){
  renderIdentityBar();
  document.getElementById('main').innerHTML = pageHead() + (VIEW==='result'? resultView() : configView());
}
render();
</script>
</body>
</html>
