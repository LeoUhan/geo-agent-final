<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 智能体 · 可见性监测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --surface:#ffffff; --ink:#16181b; --ink-70:#494c52; --ink-50:#787c84; --ink-30:#c4c6ca;
  --line:#e5e3dc; --line-2:#eeece6;
  --accent:#0b5e56; --accent-soft:#e4efed; --accent-ink:#08423c;
  --amber:#a86a00; --amber-soft:#f7ecd9;
  --risk:#a8382b; --risk-soft:#f6e6e3;
  --ok:#2f7a4d; --ok-soft:#e5f1e8;
  --radius:10px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(20,20,18,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.mono{font-family:'IBM Plex Mono',monospace}
.app{display:flex;min-height:100vh}

/* ---- 侧边栏（简化：只做本次讨论范围的定位提示） ---- */
.rail{width:64px;background:var(--ink);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px}
.rail .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-bottom:18px}
.rail .item{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#8a8d92;font-size:17px;cursor:default}
.rail .item.on{background:rgba(255,255,255,.08);color:#fff}
.rail .item .lb{display:none}

/* ---- 主区 ---- */
.main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:28px 32px 80px}
.crumb{font-size:12.5px;color:var(--ink-50);margin-bottom:6px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
.viewtabs{display:inline-flex;background:var(--line-2);border-radius:999px;padding:3px;gap:2px}
.viewtabs button{border:none;background:none;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-50);cursor:pointer;font-family:inherit}
.viewtabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---- 通用 ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px}
.sec{margin-top:26px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-head h2{font-size:14.5px;margin:0;font-weight:700}
.sec-head .sub{font-size:12px;color:var(--ink-50)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.accent{background:var(--accent-soft);color:var(--accent-ink)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.risk{background:var(--risk-soft);color:var(--risk)}
.badge.grey{background:var(--line-2);color:var(--ink-50)}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-30)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.tiny{font-size:11.5px}
.muted{color:var(--ink-50)}
a.link{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-weight:600;color:var(--ink-50);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
.bar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.pill-tab{display:inline-flex;background:var(--line-2);border-radius:8px;padding:2px}
.pill-tab button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:6px;cursor:pointer;color:var(--ink-50)}
.pill-tab button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* ---- 可信度提示条 ---- */
.credbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid #cfe4e0;border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:22px}
.credbar.warn{background:var(--amber-soft);border-color:#ecd6a6}
.credbar .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.credbar.warn .dot{background:var(--amber)}
.credbar strong{font-size:13px}
.credbar .meta{color:var(--ink-70);font-size:12.5px}
.credbar .sep{width:1px;align-self:stretch;background:var(--line);opacity:.6}

/* ---- KPI ---- */
.kpi{padding:13px 14px}
.kpi .lb{font-size:11.5px;color:var(--ink-50);display:flex;justify-content:space-between}
.kpi .val{font-size:24px;font-weight:700;margin-top:4px;font-family:'IBM Plex Mono',monospace}
.kpi .delta{font-size:12px;font-weight:600;margin-left:6px}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.down{color:var(--risk)}
.kpi .abs{font-size:11px;color:var(--ink-50);margin-top:2px}
.aux-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.aux-card{padding:10px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.aux-card .lb{font-size:11px;color:var(--ink-50)}
.aux-card .val{font-size:16px;font-weight:700;margin-top:2px}
.chart-wrap{margin-top:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink-70)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.legend .off{opacity:.35}

/* ---- 热力图 ---- */
.heat-table{width:100%;border-collapse:collapse;font-size:11.5px}
.heat-table th{font-weight:600;color:var(--ink-50);text-align:center;padding:6px 4px}
.heat-table th:first-child{text-align:left}
.heat-table td{text-align:center;padding:4px}
.heat-table td:first-child{text-align:left;font-weight:600;padding:6px 8px;white-space:nowrap}
.heat-cell{width:56px;height:34px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#fff;cursor:pointer}

/* ---- 表格行状态 ---- */
tr.changed td{background:#fbfaf6}
.hit{display:inline-flex;width:20px;height:20px;border-radius:5px;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;margin-right:2px}
.hit.rec{background:var(--ok)}
.hit.men{background:var(--amber)}
.hit.no{background:var(--line-2);color:var(--ink-30)}

/* ---- 引导流程 ---- */
.wizard{max-width:720px;margin:0 auto}
.steps-bar{display:flex;align-items:center;margin-bottom:26px}
.steps-bar .s{display:flex;align-items:center;flex:1}
.steps-bar .s .circ{width:26px;height:26px;border-radius:50%;background:var(--line-2);color:var(--ink-50);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.steps-bar .s.done .circ{background:var(--accent);color:#fff}
.steps-bar .s.now .circ{background:var(--ink);color:#fff}
.steps-bar .s .lb{font-size:12px;margin-left:8px;color:var(--ink-50);white-space:nowrap}
.steps-bar .s.now .lb,.steps-bar .s.done .lb{color:var(--ink);font-weight:600}
.steps-bar .rule{flex:1;height:1px;background:var(--line);margin:0 10px}
.steps-bar .rule.done{background:var(--accent)}
.wizcard{padding:22px 24px}
.wizcard h3{margin:0 0 4px;font-size:16px}
.wizcard .desc{color:var(--ink-50);font-size:12.5px;margin-bottom:16px}
.field-row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2);gap:16px}
.field-row:last-child{border-bottom:none}
.field-row .k{font-size:12.5px;font-weight:600;min-width:110px;flex-shrink:0}
.field-row .v{font-size:12.5px;color:var(--ink-70);flex:1}
.field-row .src{font-size:10.5px;margin-top:3px}
.persona-card{border:1px solid var(--line);border-radius:10px;padding:12px 13px;position:relative}
.persona-card.pending{border-color:#ecd6a6;background:#fffdf8}
.persona-card h4{margin:0 0 3px;font-size:13px}
.persona-card .role{font-size:11px;color:var(--ink-50);margin-bottom:8px}
.persona-card .chk{position:absolute;top:12px;right:12px}
.wiz-foot{display:flex;justify-content:space-between;margin-top:20px}
.progress-wrap{text-align:center;padding:60px 20px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- 配置-已有工作区 ---- */
.pending-strip{display:flex;align-items:center;gap:12px;background:var(--amber-soft);border:1px solid #ecd6a6;border-radius:12px;padding:11px 15px;margin-bottom:18px}
.pending-strip .av{width:26px;height:26px;border-radius:50%;background:var(--amber);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.checkbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink-30);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.checkbox.on{background:var(--accent);border-color:var(--accent);color:#fff;font-size:10px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.drawer-mask{position:fixed;inset:0;background:rgba(20,18,14,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-460px;width:440px;max-width:90vw;height:100%;background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.12);transition:right .25s;z-index:41;overflow-y:auto;padding:22px}
.drawer.show{right:0}
.drawer h3{margin:0 0 4px;font-size:15px}
.drawer .close{position:absolute;top:18px;right:18px;cursor:pointer;color:var(--ink-50);font-size:18px}
.answer-block{background:var(--bg);border-radius:10px;padding:12px 13px;margin-top:10px;font-size:12px;line-height:1.7}
.answer-block mark{background:#fde9c8;padding:0 2px;border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="mark">G</div>
    <div class="item">◐</div>
    <div class="item on">◈</div>
    <div class="item">◎</div>
    <div class="item">▤</div>
    <div class="item">⚙</div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>
<div class="drawer-mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<script>
/* ============ 演示数据 ============ */
const KPIS = [
  {id:'mention', zh:'被提及率', v:42, base:28, prev:38, moe:2.8, color:'#0b5e56', def:'买家问AI时，回答里提到我们的比例'},
  {id:'rec', zh:'被推荐率', v:28, base:15, prev:24, moe:2.8, color:'#a86a00', def:'提到我们时，是否作为推荐/比较对象'},
  {id:'cite', zh:'被引用率', v:17, base:9, prev:15, moe:2.8, color:'#3f5d7a', def:'AI把官网当信息来源（给链接或具名）的比例'},
  {id:'sov', zh:'声量份额', v:27, base:17, prev:23, moe:2.8, color:'#a8382b', def:'同一批问题中，我方占所有品牌被提及的比例'}
];
const TREND = {
  weeks:['W-6','W-5','W-4','W-3','W-2','W-1','本周'],
  mention:[36,36,37,39,37,39,42], rec:[24,25,25,26,25,26,28], cite:[13,14,14,15,14,15,17], sov:[22,22,23,24,22,24,27]
};
const AUX = { pos:{v:'2.3', prev:'3.1'}, senti:{pos:71,neu:24,neg:5,fir:7} };
const PERSONAS = [
  {id:'p1', name:'复材加工厂技术负责人', mkt:'DE', st:'ok'},
  {id:'p2', name:'航空零部件采购经理', mkt:'US', st:'ok'},
  {id:'p3', name:'精密加工车间主管', mkt:'US', st:'ok'},
  {id:'p4', name:'日本商社设备采购担当', mkt:'JP', st:'ok'},
  {id:'p6', name:'汽车 Tier-1 工艺工程师', mkt:'DE', st:'pending'}
];
const TOPICS = ['碳纤维/复材切割','五轴水刀选型','水刀vs激光','钛合金航空加工','中国供应商评估'];
const HEAT = { p1:[78,72,65,40,55], p2:[52,60,48,74,58], p3:[38,55,62,30,41], p4:[12,8,15,5,6], p6:[30,44,38,26,35] };
const PROMPTS = [
  {q:'Welches 5-Achs-Wasserstrahlsystem eignet sich für CFRP ohne Delamination?', pid:'p1', mkt:'DE', hits:['rec','men','no'], pos:'1/3', tr:'up', changed:true},
  {q:'Which waterjet suppliers meet AS9100 for titanium aerospace parts?', pid:'p2', mkt:'US', hits:['rec','rec','men'], pos:'2/5', tr:'flat', changed:true},
  {q:'Affordable 5-axis waterjet for a small job shop — total cost of ownership?', pid:'p3', mkt:'US', hits:['men','no','no'], pos:'3/5', tr:'flat', changed:false},
  {q:'炭素繊維の加工に適したウォータージェット装置の海外メーカーは？', pid:'p4', mkt:'JP', hits:['no','no','no'], pos:'未命中', tr:'new', changed:true},
  {q:'Waterjet vs laser for carbon fiber — which should a startup buy first?', pid:'p3', mkt:'US', hits:['men','rec','no'], pos:'仅提及', tr:'flat', changed:false},
  {q:'Is APW reliable compared with Flow and OMAX on service and uptime?', pid:'p6', mkt:'DE', hits:['men','no','no'], pos:'仅提及', tr:'new', changed:true}
];
const SOURCES = [
  {dom:'compositesworld.com', cover:'复材加工·工艺对比', cited:'五引擎高频', us:'无提及', risk:true},
  {dom:'reddit.com/r/Machinists', cover:'设备选型讨论', cited:'ChatGPT中频', us:'1条旧帖', risk:false},
  {dom:'thefabricator.com', cover:'金属加工', cited:'AI Overviews中频', us:'无提及', risk:true},
  {dom:'youtube.com', cover:'试切演示视频', cited:'Gemini高频', us:'有频道·未结构化', risk:false}
];
const INPUTS = [
  {k:'品牌与别名', v:'APW · APW Waterjet · 安培威', src:'知识库继承', st:'ok'},
  {k:'产品线', v:'五轴水刀切割系统 · 三轴水刀 · 高压泵与耗材', src:'官网扫描', st:'ok'},
  {k:'目标市场×语言', v:'DE·US·JP ｜ DE·EN·JA', src:'知识库继承', st:'ok'},
  {k:'竞争对手', v:'Flow Intl · OMAX · Bystronic', src:'知识库继承', st:'ok'},
  {k:'可对外事实', v:'46条 · 精度±0.05mm · CE/AS9100供应链', src:'知识库继承', st:'ok'},
  {k:'AI新识别竞对', v:'Techni Waterjet · KMT（未在名单内但被高频并列）', src:'AI识别', st:'pending'}
];
const PROMPT_LIB = [
  {q:'Welches 5-Achs-Wasserstrahlsystem eignet sich für CFRP ohne Delamination?', pid:'p1', ev:3, st:'ok'},
  {q:'Which waterjet suppliers meet AS9100 for titanium aerospace parts?', pid:'p2', ev:3, st:'ok'},
  {q:'炭素繊維の加工に適したウォータージェット装置の海外メーカーは？', pid:'p4', ev:1, st:'pending'},
  {q:'Is APW a reliable waterjet brand compared with Flow and OMAX?', pid:'p6', ev:2, st:'pending'}
];

let VIEW='result';           // result | config
let CFG_MODE='demo-switch';  // 用于演示切换：first(首次引导) | edit(已有工作区)
let WIZ_STEP=1;
let WIZ_SAMPLING=false;
let CFG_TAB='inputs';
let SHOW_ALL_PROMPTS=false;
let HEAT_METRIC='topic';

function h(strings,...vals){return strings.reduce((a,s,i)=>a+s+(vals[i]??''),'')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200)}
function openDrawer(html){document.getElementById('drawer').innerHTML=html;document.getElementById('mask').classList.add('show');document.getElementById('drawer').classList.add('show')}
function closeDrawer(){document.getElementById('mask').classList.remove('show');document.getElementById('drawer').classList.remove('show')}

function pt(a,b){const x=a-b;return (x>=0?'+':'')+x+'pt'}

/* ============ 顶部 ============ */
function pageHead(){
  return `<div class="crumb">GEO 智能体 › 可见性监测</div>
  <div class="pagehead">
    <h1>可见性监测</h1>
    <div class="viewtabs">
      <button class="${VIEW==='result'?'on':''}" onclick="setView('result')">监测结果</button>
      <button class="${VIEW==='config'?'on':''}" onclick="setView('config')">监测配置</button>
    </div>
  </div>`;
}

/* ============ 结果视图 ============ */
function credBar(){
  return `<div class="credbar">
    <span class="dot"></span>
    <strong>全景审计 · 09-01</strong>
    <span class="meta">样本量 n=1,200 · 误差带 ±2.8pp</span>
    <span class="sep"></span>
    <span class="badge accent">决策级数据</span>
    <span class="meta">下次全景审计：10-01 · 期间更新为哨兵快照（仅供方向参考）</span>
  </div>`;
}

function lineChart(){
  const w=640,ht=170,pad=26;
  const weeks=TREND.weeks;
  const maxV=50;
  const x=i=>pad+i*((w-pad*2)/(weeks.length-1));
  const y=v=>ht-pad*0.6-(v/maxV)*(ht-pad*1.1);
  let svg=`<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px">`;
  // grid
  for(let g=0;g<=4;g++){const gy=pad*0.4+g*((ht-pad)/4);svg+=`<line x1="${pad}" y1="${gy}" x2="${w-pad}" y2="${gy}" stroke="#eeece6" stroke-width="1"/>`;}
  KPIS.forEach(k=>{
    if(document.getElementById('leg-'+k.id) && document.getElementById('leg-'+k.id).dataset.off==='1') return;
    const data=TREND[k.id];
    const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg+=`<polyline points="${pts}" fill="none" stroke="${k.color}" stroke-width="${k.id==='mention'?2.6:1.8}"/>`;
    data.forEach((v,i)=>svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${k.color}"/>`);
  });
  weeks.forEach((wl,i)=>svg+=`<text x="${x(i)}" y="${ht-4}" font-size="9.5" fill="#787c84" text-anchor="middle">${wl}</text>`);
  svg+='</svg>';
  return svg;
}

function kpiBlock(){
  const chips = KPIS.map(k=>`<div class="card kpi" style="border-left:3px solid ${k.color}">
    <div class="lb">${k.zh}<span>±${k.moe}pp</span></div>
    <div class="val" style="color:${k.color}">${k.v}%<span class="delta ${k.v>=k.prev?'up':'down'}">${pt(k.v,k.prev)}</span></div>
    <div class="abs">较基线 ${k.base}% → ${k.v}%（${pt(k.v,k.base)}）</div>
    <div class="tiny muted" style="margin-top:6px">${k.def}</div>
  </div>`).join('');

  const legend = KPIS.map(k=>`<span id="leg-${k.id}" data-off="0" onclick="toggleLeg('${k.id}')"><i style="background:${k.color}"></i>${k.zh}</span>`).join('');

  return `<div class="grid g4">${chips}</div>
  <div class="chart-wrap">
    <div class="legend">${legend}</div>
    <div id="chartHolder">${lineChart()}</div>
  </div>
  <div class="aux-row">
    <div class="aux-card"><div class="lb">辅助 · 平均位次（不进合约，只做趋势解释）</div><div class="val">${AUX.pos.v} <span class="tiny muted">从 ${AUX.pos.prev}</span></div></div>
    <div class="aux-card"><div class="lb">辅助 · 情感与事实错误率</div>
      <div class="val" style="font-size:13px">正面 ${AUX.senti.pos}% · 中性 ${AUX.senti.neu}% · 负面 ${AUX.senti.neg}%
        <span style="color:var(--risk);margin-left:8px">事实错误率 ${AUX.senti.fir}%</span></div></div>
  </div>`;
}
function toggleLeg(id){const el=document.getElementById('leg-'+id);const off=el.dataset.off==='1';el.dataset.off=off?'0':'1';el.classList.toggle('off',!off);document.getElementById('chartHolder').innerHTML=lineChart();}

function heatmap(){
  const cols = HEAT_METRIC==='topic'?TOPICS:['DE','US','JP'];
  const color=v=>{ // 0-100 -> teal scale
    const a = 0.15+ (v/100)*0.85;
    return `rgba(11,94,86,${a})`;
  };
  const rows = PERSONAS.map(p=>{
    const arr = HEAT_METRIC==='topic'? HEAT[p.id] : [ (HEAT[p.id]||[0,0,0,0,0])[0], (HEAT[p.id]||[0,0,0,0,0])[1], p.mkt==='JP'?9:null ];
    return `<tr><td>${p.name}</td>${arr.map((v,i)=> v==null? `<td><div class="heat-cell" style="background:var(--line-2);color:var(--ink-30)">—</div></td>` : `<td><div class="heat-cell" style="background:${color(v)}" onclick="drillHeat('${p.id}','${cols[i]}')" title="点击查看该人设在此${HEAT_METRIC==='topic'?'主题':'市场'}下的提问">${v}</div></td>`).join('')}</tr>`;
  }).join('');
  return `<div class="pill-tab" style="margin-bottom:12px">
    <button class="${HEAT_METRIC==='topic'?'on':''}" onclick="setHeatMetric('topic')">按主题</button>
    <button class="${HEAT_METRIC==='market'?'on':''}" onclick="setHeatMetric('market')">按市场</button>
  </div>
  <table class="heat-table"><thead><tr><th>人设 \\ ${HEAT_METRIC==='topic'?'主题':'市场'}</th>${cols.map(c=>`<th>${c.length>8?c.slice(0,8)+'…':c}</th>`).join('')}</tr></thead>
  <tbody>${rows}</tbody></table>
  <div class="tiny muted" style="margin-top:8px">颜色深浅 = 被提及率。点击格子下钻到该人设在此维度下的具体提问结果。</div>`;
}
function setHeatMetric(m){HEAT_METRIC=m;render();}
function drillHeat(pid,col){toast('已定位到「'+ (PERSONAS.find(p=>p.id===pid)||{}).name +' × '+col+'」相关提问（演示：滚动至下方结果表并筛选）');}

function hitIcon(h){
  const map={rec:['✓','rec'],men:['·','men'],no:['—','no']};
  const [t,c]=map[h];
  return `<span class="hit ${c}">${t}</span>`;
}
function promptsTable(){
  const changed = PROMPTS.filter(p=>p.changed);
  const rest = PROMPTS.filter(p=>!p.changed);
  const list = SHOW_ALL_PROMPTS? PROMPTS : changed;
  const rows = list.map(p=>`<tr class="${p.changed?'changed':''}" style="cursor:pointer" onclick='openPromptDetail(${JSON.stringify(p.q)})'>
    <td style="max-width:280px"><strong style="font-size:12.5px">${p.q}</strong>
      <div class="tiny muted" style="margin-top:2px">${(PERSONAS.find(x=>x.id===p.pid)||{}).name||''} · ${p.mkt}</div></td>
    <td>${p.hits.map(hitIcon).join('')}</td>
    <td class="mono">${p.pos}</td>
    <td>${p.tr==='up'?'<span style="color:var(--ok)">↑</span>':p.tr==='new'?'<span class="badge amber">新</span>':'<span class="muted">→</span>'}</td>
  </tr>`).join('');
  return `<table class="tbl"><thead><tr><th style="min-width:280px">提问</th><th>引擎命中</th><th>位次</th><th>趋势</th></tr></thead><tbody>${rows}</tbody></table>
  ${!SHOW_ALL_PROMPTS && rest.length ? `<div style="text-align:center;margin-top:10px"><button class="btn sm" onclick="showAllPrompts()">查看全部 ${PROMPTS.length} 条（含 ${rest.length} 条本期无变化）</button></div>`:''}
  <div class="tiny muted" style="margin-top:10px"><span class="hit rec" style="margin-right:4px">✓</span>推荐　<span class="hit men" style="margin-right:4px">·</span>仅提及　<span class="hit no" style="margin-right:4px">—</span>未命中</div>`;
}
function showAllPrompts(){SHOW_ALL_PROMPTS=true;render();}
function openPromptDetail(q){
  const p = PROMPTS.find(x=>x.q===q);
  openDrawer(`<span class="close" onclick="closeDrawer()">✕</span>
  <h3>提问详情</h3>
  <div class="tiny muted" style="margin-bottom:14px">${(PERSONAS.find(x=>x.id===p.pid)||{}).name} · ${p.mkt}</div>
  <div class="card" style="padding:12px 14px"><strong style="font-size:13px">${p.q}</strong></div>
  <div class="sec-head" style="margin-top:18px"><h2>五引擎回答摘录</h2></div>
  <div class="answer-block"><b>ChatGPT</b> · 位次 1/3<br>Für CFRP ohne Delamination empfiehlt sich 5-Achs-Wasserstrahlschneiden… <mark>APW</mark> bietet ein 5-Achs-System mit dynamischer Kopfkompensation…</div>
  <div class="answer-block"><b>Perplexity</b> · 仅提及<br>该问题下同时提到 Flow、OMAX 与 <mark>APW</mark>，但未附官网链接来源。</div>
  <div class="answer-block" style="opacity:.6"><b>Gemini</b> · 未命中<br>回答中未出现相关品牌名。</div>
  <div class="tiny muted" style="margin-top:14px">这些发现会在「诊断与策略」中给出具体处理建议。</div>`);
}

function sourceTable(){
  return `<table class="tbl"><thead><tr><th>来源域名</th><th>覆盖主题</th><th>被引频次</th><th>我方提及</th></tr></thead><tbody>
  ${SOURCES.map(s=>`<tr><td><strong style="font-size:12.5px">${s.dom}</strong></td><td class="tiny">${s.cover}</td><td class="tiny">${s.cited}</td>
    <td>${s.risk?`<span class="badge risk">${s.us}</span>`:`<span class="badge grey">${s.us}</span>`}</td></tr>`).join('')}
  </tbody></table>
  <div class="tiny muted" style="margin-top:10px">这里只呈现「AI在引用谁」；为什么我方缺席、该怎么做，在<a class="link" onclick="toast('跳转至诊断与策略（演示）')">诊断与策略</a>中给出。</div>`;
}

function resultView(){
  return credBar()
  + `<div class="sec"><div class="sec-head"><h2>① GEO效果 · IAB 四主指标</h2><span class="sub">先看变化量，再看绝对值</span></div><div class="card">${kpiBlock()}</div></div>`
  + `<div class="sec"><div class="sec-head"><h2>② 人设 × ${HEAT_METRIC==='topic'?'主题':'市场'} 热力图</h2><span class="sub">定位最薄弱的组合</span></div><div class="card">${heatmap()}</div></div>`
  + `<div class="sec"><div class="sec-head"><h2>③ 提问级结果</h2><span class="sub">默认只显示本期有变化的提问</span></div><div class="card">${promptsTable()}</div></div>`
  + `<div class="sec"><div class="sec-head"><h2>④ 来源图谱</h2><span class="sub">谁在影响行业AI回答</span></div><div class="card">${sourceTable()}</div></div>`;
}

/* ============ 配置视图 ============ */
function configView(){
  return `<div class="card" style="margin-bottom:18px;background:var(--bg);border-style:dashed">
    <div class="tiny muted">演示切换（实际产品中由"是否已有监测数据"自动判定）：
    <button class="btn sm ${CFG_MODE==='first'?'primary':''}" onclick="setCfgMode('first')" style="margin-left:8px">新工作区·首次引导</button>
    <button class="btn sm ${CFG_MODE==='edit'?'primary':''}" onclick="setCfgMode('edit')">已配置·自由编辑</button></div>
  </div>`
  + (CFG_MODE==='first'? wizardView() : editView());
}

const WIZ_TITLES=['输入底座','买家人设','提问库','监测计划'];
function setCfgMode(m){CFG_MODE=m;WIZ_STEP=1;WIZ_SAMPLING=false;render();}
function wizardView(){
  if(WIZ_SAMPLING){
    return `<div class="wizard"><div class="card progress-wrap"><div class="spin"></div>
      <strong style="font-size:14.5px">首次采样进行中…</strong>
      <div class="tiny muted" style="margin-top:8px">预计 20–40 分钟 · 关闭页面不影响进度，完成后可在「概览」查看提醒</div>
      <button class="btn sm" style="margin-top:18px" onclick="finishSampling()">（演示）立即查看结果</button>
    </div></div>`;
  }
  const stepsBar = `<div class="steps-bar">${WIZ_TITLES.map((t,i)=>{
    const n=i+1, st = n<WIZ_STEP?'done':n===WIZ_STEP?'now':'';
    return `<div class="s ${st}"><div class="circ">${n<WIZ_STEP?'✓':n}</div><div class="lb">${t}</div></div>${i<3?`<div class="rule ${n<WIZ_STEP?'done':''}"></div>`:''}`;
  }).join('')}</div>`;

  let body='';
  if(WIZ_STEP===1){
    body = `<h3>确认输入底座</h3><div class="desc">已从企业知识库继承、官网扫描预填，请确认或编辑</div>
    ${INPUTS.slice(0,5).map(x=>`<div class="field-row"><div class="k">${x.k}</div><div class="v">${x.v}<div class="src"><span class="badge accent">${x.src}</span></div></div><button class="btn sm" onclick="toast('编辑「${x.k}」（演示）')">编辑</button></div>`).join('')}
    <div class="tiny muted" style="margin-top:14px">品牌 / 产品线 / 目标市场为必填；竞对与事实可跳过，之后在监测配置中补充。</div>`;
  } else if(WIZ_STEP===2){
    body = `<h3>确认买家人设</h3><div class="desc">AI基于输入底座生成的人设，至少确认1个才能继续</div>
    <div class="grid g2">${PERSONAS.map(p=>`<div class="persona-card ${p.st==='pending'?'pending':''}">
      <span class="chk"><span class="checkbox ${p.st==='ok'?'on':''}" onclick="toast('已确认（演示）')">${p.st==='ok'?'✓':''}</span></span>
      <h4>${p.name}</h4><div class="role">${p.mkt} 市场${p.st==='pending'?' · AI生成·待确认':''}</div>
      <div class="tiny muted">点击查看决策因子与口吻示例</div></div>`).join('')}</div>
    <div style="margin-top:12px"><button class="btn sm" onclick="toast('新增人设草稿（演示）')">＋ 新增人设</button></div>`;
  } else if(WIZ_STEP===3){
    body = `<h3>确认提问库</h3><div class="desc">按人设与主题生成，证据不足2项的默认不勾选</div>
    <table class="tbl"><thead><tr><th style="width:24px"></th><th>提问</th><th>证据</th><th>状态</th></tr></thead><tbody>
    ${PROMPT_LIB.map(p=>`<tr><td><span class="checkbox ${p.ev>=2?'on':''}">${p.ev>=2?'✓':''}</span></td><td style="font-size:12.5px">${p.q}</td>
      <td class="mono">${p.ev}/4</td><td>${p.ev>=2?'<span class="badge ok">已入库</span>':'<span class="badge amber">待确认</span>'}</td></tr>`).join('')}
    </tbody></table>
    <div style="margin-top:12px"><button class="btn sm" onclick="toast('手动新增提问（演示）')">＋ 手动新增</button></div>`;
  } else if(WIZ_STEP===4){
    body = `<h3>确认监测计划</h3><div class="desc">本次将执行的监测范围（由套餐档位决定上限）</div>
    <div class="field-row"><div class="k">监测提问</div><div class="v">3 条（当前确认数）</div></div>
    <div class="field-row"><div class="k">AI引擎</div><div class="v">Google 系 3 引擎（入门版）</div></div>
    <div class="field-row"><div class="k">监测频率</div><div class="v">每周 · 哨兵快照每日</div></div>
    <div class="field-row"><div class="k">首次全景审计</div><div class="v">确认后立即启动</div></div>`;
  }

  return `<div class="wizard">${stepsBar}<div class="card wizcard">${body}
    <div class="wiz-foot">
      <button class="btn" ${WIZ_STEP===1?'disabled':''} onclick="wizBack()">上一步</button>
      <button class="btn primary" onclick="wizNext()">${WIZ_STEP<4?'下一步':'确认并启动首次监测'}</button>
    </div></div></div>`;
}
function wizNext(){ if(WIZ_STEP<4){WIZ_STEP++;render();} else {WIZ_SAMPLING=true;render();} }
function wizBack(){ if(WIZ_STEP>1){WIZ_STEP--;render();} }
function finishSampling(){ WIZ_SAMPLING=false; CFG_MODE='edit'; VIEW='result'; render(); toast('首次监测完成，已生成监测结果'); }

function editView(){
  const pendingCount = INPUTS.filter(x=>x.st==='pending').length + PERSONAS.filter(p=>p.st==='pending').length + PROMPT_LIB.filter(p=>p.st==='pending').length;
  const pendingStrip = pendingCount? `<div class="pending-strip"><span class="av">!</span>
    <span style="flex:1"><b>有 ${pendingCount} 项待确认</b>——AI新识别竞对 1 项、待确认人设 1 个、低证据提问 1 条</span>
    <button class="btn sm primary" onclick="toast('逐项确认引导（演示）')">逐项处理 →</button></div>` : '';

  const tabs = `<div class="pill-tab" style="margin-bottom:16px">
    <button class="${CFG_TAB==='inputs'?'on':''}" onclick="setCfgTab('inputs')">输入底座</button>
    <button class="${CFG_TAB==='personas'?'on':''}" onclick="setCfgTab('personas')">买家人设</button>
    <button class="${CFG_TAB==='prompts'?'on':''}" onclick="setCfgTab('prompts')">提问库</button>
  </div>`;

  let body='';
  if(CFG_TAB==='inputs'){
    body = `<table class="tbl"><thead><tr><th style="width:120px">输入项</th><th>当前值</th><th>来源</th><th>状态</th><th></th></tr></thead><tbody>
    ${INPUTS.map(x=>`<tr class="${x.st==='pending'?'changed':''}"><td><b style="font-size:12.5px">${x.k}</b></td><td class="tiny">${x.v}</td>
      <td><span class="badge grey">${x.src}</span></td>
      <td>${x.st==='pending'?'<span class="badge amber">待确认</span>':'<span class="badge ok">已确认</span>'}</td>
      <td>${x.st==='pending'?`<button class="btn sm primary" onclick="confirmInput('${x.k}')">确认</button>`:`<button class="btn sm" onclick="editInput('${x.k}')">编辑</button>`}</td></tr>`).join('')}
    </tbody></table>
    <div class="tiny muted" style="margin-top:12px">修改竞对名单或品牌别名会重算下游基线，历史数据不可比——保存前会二次确认影响范围。</div>`;
  } else if(CFG_TAB==='personas'){
    body = `<div class="grid g2">${PERSONAS.map(p=>`<div class="persona-card ${p.st==='pending'?'pending':''}">
      <h4>${p.name}</h4><div class="role">${p.mkt} 市场${p.st==='pending'?' · 待确认':''}</div>
      <div class="tiny" style="margin-top:6px">${p.st==='pending'?`<button class="btn sm primary" onclick="toast('已确认（演示）')">确认</button> <button class="btn sm" onclick="toast('编辑（演示）')">编辑</button>`:`<button class="btn sm" onclick="toast('编辑（演示）')">编辑</button>`}</div>
    </div>`).join('')}</div>
    <div style="margin-top:12px"><button class="btn sm" onclick="toast('AI生成新人设（演示）')">＋ AI生成新人设</button></div>`;
  } else {
    body = `<table class="tbl"><thead><tr><th>提问</th><th>人设</th><th>证据</th><th>状态</th><th></th></tr></thead><tbody>
    ${PROMPT_LIB.map(p=>`<tr class="${p.st==='pending'?'changed':''}"><td style="font-size:12.5px">${p.q}</td><td class="tiny">${(PERSONAS.find(x=>x.id===p.pid)||{}).name||''}</td>
      <td class="mono">${p.ev}/4</td><td>${p.ev>=2?'<span class="badge ok">已入库</span>':'<span class="badge amber">待确认</span>'}</td>
      <td>${p.st==='pending'?`<button class="btn sm primary" onclick="toast('已确认入库（演示）')">确认</button>`:`<button class="btn sm" onclick="toast('编辑（演示）')">编辑</button>`}</td></tr>`).join('')}
    </tbody></table>
    <div style="margin-top:12px"><button class="btn sm" onclick="toast('手动新增提问（演示）')">＋ 手动新增</button></div>`;
  }
  return pendingStrip + tabs + `<div class="card">${body}</div>`;
}
function setCfgTab(t){CFG_TAB=t;render();}
function confirmInput(k){toast('已采纳「'+k+'」，下次全景审计重算基线并标注（演示）');}
function editInput(k){toast('编辑「'+k+'」（演示）');}

/* ============ 渲染入口 ============ */
function setView(v){VIEW=v;render();}
function render(){
  SHOW_ALL_PROMPTS = VIEW==='result'? SHOW_ALL_PROMPTS : false;
  document.getElementById('main').innerHTML = pageHead() + (VIEW==='result'? resultView() : configView());
}
render();
</script>
</body>
</html>
