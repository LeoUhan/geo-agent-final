<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 智能体 · 可见性监测</title>
<style>
:root{
  /* ---- 品牌与状态色（严格取自设计规范token表，不新增颜色）---- */
  --brand:#4152F6; --brand-dark:#2F3FD0; --brand-light:#E8EAFE; --brand-light-2:#DEE2FD;
  --bg-light:#EEF1F7; --bg-dark:#171A21;
  --ink:#1D2129; --ink-70:#4E5969; --ink-50:#86909C; --ink-30:#C9CDD4;
  --line:#E5E6EB; --line-2:#F2F3F5;
  --ok:#00B42A; --ok-bg:#E8FFEA;
  --warn:#FF7D00; --warn-bg:#FFF3E5;
  --risk:#F53F3F; --risk-bg:#FEE9E8;
  --inherit-purple:#722ED1; --inherit-purple-bg:#F3ECFC;
  --share-cyan:#14A9A9; --share-cyan-bg:#E3F7F7;
  --white:#ffffff;
  /* 别名：兼容既有类名（gold=warn，teal=brand，cream=页面浅色背景），值仍取自上面同一套token，不引入新色 */
  --gold:var(--warn); --gold-100:var(--warn-bg);
  --teal:var(--brand); --teal-800:var(--brand-dark); --teal-600:var(--brand); --teal-900:var(--bg-dark);
  --teal-050:var(--brand-light); --teal-100:var(--brand-light-2);
  --cream:var(--bg-light);
  --r-sm:4px; --r:8px; --r-lg:16px;
  --sh-1:none; --sh-2:0 4px 14px rgba(23,26,33,.10);
  --f-ui:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --f-mono:var(--f-ui);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-ui);background:var(--bg-light);color:var(--ink);font-size:14px;line-height:1.57;-webkit-font-smoothing:antialiased}
.mono{font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:flex;min-height:100vh}

/* ---- 侧边栏 ---- */
.sidebar{width:240px;flex-shrink:0;background:var(--white);color:var(--ink);display:flex;flex-direction:column;border-right:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:8px;padding:16px 16px;border-bottom:1px solid var(--line)}
.sb-brand .logo{color:var(--brand);font-weight:600;font-size:15px}
.sb-brand .name{font-weight:500;font-size:13px;color:var(--ink)}
.sb-brand .sub{font-size:12px;color:var(--ink-50);margin-top:1px}
.nav{padding:8px 8px;flex:1}
.nav .grp-title{font-size:12px;color:var(--ink-50);padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;color:var(--ink-70);font-size:14px;font-weight:500;cursor:default;margin-bottom:1px}
.nav-item.active{background:var(--brand-light);color:var(--brand)}
.nav-item .ico{width:16px;text-align:center;opacity:.85}
.nav-sub{margin-left:24px;margin-top:2px;margin-bottom:4px}
.nav-sub .s-item{display:flex;align-items:center;justify-content:space-between;padding:8px 8px;border-radius:8px;font-size:12px;color:var(--ink-70);cursor:pointer}
.nav-sub .s-item:hover{background:var(--line-2);color:var(--ink)}
.nav-sub .s-item.on{background:var(--brand-light);color:var(--brand);font-weight:600}
.sb-foot{padding:12px 16px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-50)}

/* ---- 主区 / 页面框架 ---- */
.main{flex:1;min-width:0;overflow-y:auto}
.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;background:var(--white);position:sticky;top:0;z-index:5}
.mode-bar{display:flex;align-items:center;gap:14px;padding:8px 24px;background:var(--line-2);border-bottom:1px solid var(--line);color:var(--ink-70);font-size:12px;flex-wrap:wrap}
.mode-bar b{color:var(--ink);font-weight:600}
.mode-bar .seg{border-bottom:none;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:2px}
.mode-bar .seg button{height:26px;padding:0 12px;color:var(--ink-70);border-radius:6px;margin-bottom:0;border-bottom:none}
.mode-bar .seg button.on{background:var(--brand-light);color:var(--brand);border-bottom:none}
.mode-bar .seg[disabled]{opacity:.4;pointer-events:none}
.crumb{font-size:12px;color:var(--ink-50)}
.content{max-width:980px;margin:0 auto;padding:24px 24px 40px}

.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:12px;flex-wrap:wrap}
.pagehead h1{font-size:20px;line-height:28px;margin:0;font-weight:600}
.pagehead .desc{font-size:14px;line-height:22px;color:var(--ink-70);margin-top:4px;max-width:640px}

/* 页面级 Tabs（规范 5.1）：44px 高，选中项品牌蓝 600 字重 + 2px 指示线 */
.seg{display:flex;border-bottom:1px solid var(--line);gap:0}
.seg button{border:none;background:none;height:44px;padding:0 16px;font-size:14px;font-weight:500;color:var(--ink-70);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.sec{margin-top:24px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:16px;line-height:24px;margin:0;font-weight:500}
.sec-head .sub{font-size:12px;color:var(--ink-50)}

/* 胶囊状态标签（规范 2.4 / 9） */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:20px;font-weight:500;padding:0 8px;border-radius:999px}
.badge.teal{background:var(--brand-light);color:var(--brand)}
.badge.inherit{background:var(--inherit-purple-bg);color:var(--inherit-purple)}
.badge.gold{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.risk{background:var(--risk-bg);color:var(--risk)}
.badge.grey{background:var(--line-2);color:var(--ink-70)}

/* 控件：32px 高，8px 圆角（规范 10） */
.btn{font-family:inherit;font-size:14px;font-weight:500;border-radius:8px;height:32px;padding:0 14px;border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;transition:border-color .16s ease-out,background .16s ease-out,color .16s ease-out}
.btn:hover{border-color:var(--ink-30)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.sm{height:26px;padding:0 10px;font-size:12px} /* 例外：用于密集行内操作，脱离32px基准高度以避免撑破紧凑表格行 */
.btn[disabled]{opacity:.5;cursor:not-allowed;color:var(--ink-30)}
.btn[disabled]:hover{border-color:var(--line)}
.inp{font-family:inherit;font-size:14px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;outline:none;width:100%;transition:border-color .16s ease-out}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light)}
select.inp{height:32px}
textarea.inp{height:auto;padding:8px 12px}

.tiny{font-size:12px;line-height:20px}
.muted{color:var(--ink-50)}
.linkbtn{color:var(--brand);font-weight:500;cursor:pointer;background:none;border:none;font-family:inherit;font-size:inherit;padding:0}

/* 表格（规范 9） */
table.tbl{width:100%;border-collapse:collapse;font-size:14px;border:1px solid var(--line);border-radius:8px}
table.tbl th{text-align:left;font-weight:500;color:var(--ink-70);font-size:12px;padding:8px 16px;background:var(--line-2);border-bottom:1px solid var(--line)}
table.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.changed td{background:var(--warn-bg)}
table.tbl tr.filtered-out{display:none}
table.tbl td.num,table.tbl th.num{text-align:right}

/* 产品切换风格的次级 Tabs（规范 5.2，用于各处二级筛选/模式切换） */
.seg-sm{display:inline-flex;background:var(--line-2);border-radius:8px;padding:2px}
.seg-sm button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--ink-70)}
.seg-sm button.on{background:var(--brand-light);color:var(--brand);font-weight:600}

.checkbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink-30);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#fff;flex-shrink:0;background:#fff;transition:background .16s ease-out,border-color .16s ease-out}
.checkbox.on{background:var(--brand);border-color:var(--brand)}
.checkbox.disabled{opacity:.5;cursor:not-allowed}

/* 可信度提示条 */
.credbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:24px;background:var(--white)}
.credbar .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.credbar b{font-size:14px;font-weight:600}
.credbar .meta{color:var(--ink-70);font-size:12px}
.credbar .sep{width:1px;align-self:stretch;background:var(--line)}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{padding:16px;border-radius:var(--r);border:1px solid var(--line)}
.kpi .lb{font-size:12px;color:var(--ink-50);font-weight:500}
.kpi .val{font-size:24px;line-height:32px;font-weight:600;margin-top:4px}
.kpi .delta{font-size:12px;font-weight:600;margin-left:6px}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.down{color:var(--risk)}
.kpi .abs{font-size:12px;color:var(--ink-50);margin-top:4px}
.kpi .def{font-size:12px;color:var(--ink-50);margin-top:8px;line-height:20px}

.aux-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.aux-card{padding:12px;border:1px dashed var(--line);border-radius:var(--r)}
.aux-card .lb{font-size:12px;color:var(--ink-50);font-weight:500}
.aux-card .val{font-size:20px;line-height:28px;font-weight:500;margin-top:4px}
.senti-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.chart-wrap{margin-top:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-70)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend .off{opacity:.3}

.heat-table{width:100%;border-collapse:collapse;font-size:12px}
.heat-table th{font-weight:500;color:var(--ink-50);text-align:center;padding:0 4px 8px}
.heat-table th:first-child{text-align:left}
.heat-table td{text-align:center;padding:4px}
.heat-table td:first-child{text-align:left;font-weight:500;padding:8px 8px 8px 0;white-space:nowrap;font-size:14px}
.heat-cell{width:100%;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;transition:transform .16s ease-out}
.heat-cell:hover{transform:scale(1.06)}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn);padding:0 8px;height:20px;border-radius:999px;font-size:12px;font-weight:500;margin-bottom:12px}
.filter-chip button{background:none;border:none;color:var(--warn);cursor:pointer;font-weight:600;font-family:inherit}

.hit{display:inline-flex;width:20px;height:20px;border-radius:4px;align-items:center;justify-content:center;font-size:10px;font-weight:600;margin-right:4px}
.hit.rec{background:var(--ok-bg);color:var(--ok)}
.hit.men{background:var(--warn-bg);color:var(--warn)}
.hit.no{background:var(--line-2);color:var(--ink-30)}

.wizard{max-width:600px;margin:0 auto}
.steps-bar{display:flex;align-items:center;margin-bottom:24px}
.steps-bar .s{display:flex;align-items:center;flex:1}
.steps-bar .s .circ{width:24px;height:24px;border-radius:50%;background:var(--line-2);color:var(--ink-50);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.steps-bar .s.done .circ{background:var(--brand);color:#fff}
.steps-bar .s.now .circ{background:var(--ink);color:#fff}
.steps-bar .s .lb{font-size:12px;margin-left:8px;color:var(--ink-50);white-space:nowrap}
.steps-bar .s.now .lb,.steps-bar .s.done .lb{color:var(--ink);font-weight:600}
.steps-bar .rule{flex:1;height:1px;background:var(--line);margin:0 12px}
.steps-bar .rule.done{background:var(--brand)}
.wizcard h3{margin:0 0 4px;font-size:16px;font-weight:600}
.wizcard .desc{color:var(--ink-50);font-size:12px;margin-bottom:16px}
.field-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);gap:16px}
.field-row:last-child{border-bottom:none}
.field-row .k{font-size:14px;font-weight:500;min-width:110px;flex-shrink:0}
.field-row .v{font-size:14px;color:var(--ink-70);flex:1}
.field-row .src{margin-top:4px}
.persona-card{border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.persona-card.pending{border-color:var(--warn);background:var(--warn-bg)}
.persona-card h4{margin:0 0 4px;font-size:14px;font-weight:500}
.persona-card .role{font-size:12px;color:var(--ink-50);margin-bottom:8px}
.wiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.wiz-warn{font-size:12px;color:var(--warn);font-weight:500}
.progress-wrap{text-align:center;padding:60px 20px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);margin:0 auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.pending-strip{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px;border:1px solid var(--warn);background:var(--warn-bg);border-radius:var(--r-lg)}
.pending-strip b{font-weight:600}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .16s ease-out;z-index:60}
.toast.show{opacity:1}
.drawer-mask{position:fixed;inset:0;background:rgba(23,26,33,.32);opacity:0;pointer-events:none;transition:opacity .16s ease-out;z-index:40}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-440px;width:420px;max-width:90vw;height:100%;background:var(--white);box-shadow:var(--sh-2);transition:right .16s ease-out;z-index:41;overflow-y:auto;padding:24px}
.drawer.show{right:0}
.drawer h3{margin:0 0 4px;font-size:16px;font-weight:600}
.drawer .close{position:absolute;top:20px;right:20px;cursor:pointer;color:var(--ink-50);font-size:16px;background:none;border:none}
.answer-block{background:var(--bg-light);border-radius:var(--r);padding:12px;margin-top:8px;font-size:12px;line-height:1.7;border:1px solid var(--line)}
.answer-block mark{background:var(--warn-bg);padding:0 2px;border-radius:2px}
.demo-toggle{padding:8px 12px;border:1px dashed var(--ink-30);border-radius:var(--r);margin-bottom:16px;font-size:12px;color:var(--ink-50);background:var(--white)}

/* ---- 弹窗（居中模态，区别于右侧详情抽屉） ---- */
.modal-mask{position:fixed;inset:0;background:rgba(23,26,33,.4);opacity:0;pointer-events:none;transition:opacity .16s ease-out;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--white);border-radius:var(--r-lg);width:560px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--sh-2);transform:translateY(8px);transition:transform .16s ease-out}
.modal-mask.show .modal-box{transform:translateY(0)}
.modal-head{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.modal-head h3{margin:0;font-size:16px;font-weight:600}
.modal-head p{margin:4px 0 0;font-size:12px;color:var(--ink-50)}
.modal-head .close{position:absolute;top:16px;right:20px;background:none;border:none;cursor:pointer;color:var(--ink-50);font-size:15px}
.modal-body{padding:20px 24px}
.modal-foot{padding:12px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.mfield{margin-bottom:20px}
.mfield label{font-size:12px;font-weight:600;display:block;margin-bottom:8px}
.mfield .meta{font-size:12px;color:var(--ink-50);margin-top:8px}
.chiplist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip-item{display:inline-flex;align-items:center;gap:6px;background:var(--line-2);border:1px solid var(--line);border-radius:999px;height:24px;padding:0 6px 0 12px;font-size:12px}
.chip-item.pending{background:var(--warn-bg);border-color:var(--warn)}
.chip-item button{background:none;border:none;color:var(--ink-50);cursor:pointer;font-size:11px;padding:0 2px}
.chip-item button.ok{color:var(--ok);font-weight:600}
.chip-add{display:flex;gap:8px}
.chip-add input{flex:1}

/* ---- 主题 chips ---- */
.topic-chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-light);color:var(--brand);border:1px solid var(--brand-light-2);border-radius:999px;height:24px;padding:0 8px 0 12px;font-size:12px;font-weight:500;cursor:pointer}
.topic-chip.pending{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.topic-chip .x{opacity:.7;font-size:10px}

/* ---- 概览：工作记录卡 / 轨迹 ---- */
.workcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;background:var(--white)}
.workcard-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.workcard-tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.wtitle{font-size:14px;font-weight:600;margin-top:6px}
.wtrack{margin-top:12px}
.wt-node{display:flex;gap:10px;position:relative;padding-bottom:10px}
.wt-node:last-child{padding-bottom:0}
.wt-node:not(:last-child)::before{content:'';position:absolute;left:5px;top:16px;bottom:-4px;width:1px;background:var(--line)}
.wt-dot{width:10px;height:10px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:4px;position:relative;z-index:1}
.wt-dot.ops{background:var(--warn)}
.wt-who{font-size:12px;font-weight:600}
.wt-who .tag{font-size:11px;font-weight:500;color:var(--brand);background:var(--brand-light);padding:0 8px;height:20px;line-height:20px;border-radius:999px;margin-left:6px}
.wt-note{font-size:12px;color:var(--ink-50);margin-top:2px}
.pend-card{border:1px solid var(--warn);background:var(--warn-bg);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pend-card .t{font-size:14px;font-weight:600}
.pend-card .d{font-size:12px;color:var(--ink-70);margin-top:3px}
.wneed{font-size:12px;color:var(--ink-70);margin-top:12px}
.wact{margin-top:10px;display:flex;gap:8px;align-items:center}
.ov-metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.info-ico{cursor:help;color:var(--ink-50);font-size:11px;margin-left:4px;border:1px solid var(--ink-30);border-radius:50%;width:13px;height:13px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;line-height:1}
.progress-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.progress-row:last-child{border-bottom:none}
.mat-metric{padding:14px;border:1px solid var(--line);border-radius:var(--r)}
.mat-metric .lb{font-size:12px;color:var(--ink-50);display:flex;justify-content:space-between}
.mat-metric .val{font-size:24px;font-weight:600;margin-top:4px}
.mat-metric .val .delta{font-size:12px;font-weight:600;color:var(--ok);margin-left:6px}
.mat-metric .note{font-size:12px;color:var(--ink-50);margin-top:8px;line-height:1.5}
.downgrade-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;background:var(--ok-bg);border:1px solid var(--ok);border-radius:var(--r-lg);margin-top:16px}

function lineChart(){
  const w=740,ht=176,padL=8,padR=8,padT=14,padB=22;
  const weeks=TREND.weeks;
  const maxV=50;
  const x=i=>padL+i*((w-padL-padR)/(weeks.length-1));
  const y=v=>ht-padB-(v/maxV)*(ht-padT-padB);
  let svg=`<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;overflow:visible">`;
  for(let g=0;g<=3;g++){const gy=padT+g*((ht-padT-padB)/3);svg+=`<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#eef0ec" stroke-width="1"/>`;}
  KPIS.forEach(k=>{
    const el=document.getElementById('leg-'+k.id);
    if(el && el.dataset.off==='1') return;
    const data=TREND[k.id];
    const pts=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg+=`<polyline points="${pts}" fill="none" stroke="${k.hex}" stroke-width="${k.id==='mention'?2.6:1.7}" stroke-linejoin="round" stroke-linecap="round"/>`;
    data.forEach((v,i)=>svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${k.hex}"/>`);
  });
  weeks.forEach((wl,i)=>svg+=`<text x="${x(i)}" y="${ht-4}" font-size="10" fill="#86909C" text-anchor="middle" font-family="PingFang SC">${wl}</text>`);
  svg+='</svg>';
  return svg;

function groupBreakdown(keyFn, keys){
  return keys.map(k=>{
    const list = prompts.filter(p=>keyFn(p)===k);
    const total = list.length || 1;
    const mention = list.filter(p=>p.hits.some(h=>h!=='no')).length;
    const rec = list.filter(p=>p.hits.some(h=>h==='rec')).length;
    return {k, total:list.length, mentionPct:Math.round(mention/total*100), recPct:Math.round(rec/total*100)};
  }).filter(r=>r.total>0);
}
function breakdownRows(rows, opt){
  opt = opt || {field:'recPct', label:'被推荐', color:'var(--inherit-purple)'};

  return rows.map(r=>`<div class="field-row" style="padding:10px 0">

    <div style="flex:1;padding:0 12px">

    </div>

}
function computeEngineRows(){
  return ENGINE_NAMES.map((name,i)=>{

    const cite = prompts.filter(p=>p.cited && p.cited[i]).length;
    return {k:name, total, mentionPct:Math.round(mention/total*100), recPct:Math.round(rec/total*100), citePct:Math.round(cite/total*100)};

}

function competitorTrendChart(){
  const w=740,ht=170,padL=8,padR=100,padT=14,padB=22;
  const maxV=35;
  const x=i=>padL+i*((w-padL-padR)/(TREND_MONTHS.length-1));
  const y=v=>ht-padB-(v/maxV)*(ht-padT-padB);
  let svg=`<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px;overflow:visible">`;
  for(let g=0;g<=3;g++){const gy=padT+g*((ht-padT-padB)/3);svg+=`<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#F2F3F5" stroke-width="1"/>`;}
  COMPETITORS.forEach(c=>{
    const pts=c.trend.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg+=`<polyline points="${pts}" fill="none" stroke="${c.color}" stroke-width="${c.name.includes('我方')?2.6:1.6}" stroke-linejoin="round" stroke-linecap="round"/>`;
    c.trend.forEach((v,i)=>svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.4" fill="${c.color}"/>`);
    svg+=`<text x="${w-padR+8}" y="${y(c.trend[c.trend.length-1])+4}" font-size="11" fill="${c.color}" font-weight="600">${c.name.replace('（我方）','')}</text>`;
  });
  TREND_MONTHS.forEach((m,i)=>svg+=`<text x="${x(i)}" y="${ht-4}" font-size="10" fill="#86909C" text-anchor="middle">${m}</text>`);
  svg+='</svg>';
  return svg;
}

function openPromptDetail(q){

  const blocks = ENGINE_NAMES.map((name,i)=>{
    const h=p.hits[i];
    const label = h==='rec'?'推荐':h==='men'?'仅提及':'未命中';
    const opac = h==='no' ? 'opacity:.55' : '';
    return `<div class="answer-block" style="${opac}"><b>${name}</b> · ${label}</div>`;
  }).join('');
  const histMax = Math.max(...p.hist, p.samples.runs, 1);
  const histLabels = ['W-3','W-2','W-1','本期'];
  const histBars = p.hist.map((v,i)=>`<div style="text-align:center;flex:1">
    <div style="height:60px;display:flex;align-items:flex-end;justify-content:center"><div style="width:60%;height:${v/histMax*100}%;background:${i===p.hist.length-1?'var(--brand)':'var(--line-2)'};border-radius:4px 4px 0 0"></div></div>
    <div class="tiny muted" style="margin-top:4px">${histLabels[i]}</div>
    <div class="tiny mono" style="font-weight:700">${v}</div>

  <h3>提问详情</h3>
  <div class="tiny muted" style="margin-bottom:16px">${(personas.find(x=>x.id===p.pid)||{}).name} · ${p.mkt} · ${p.intent}</div>
  <div class="card" style="padding:14px 16px;box-shadow:none"><span style="font-weight:700;font-size:13px">${p.q}</span></div>
  <div class="tiny muted" style="margin-top:12px">本期采样 ${p.samples.runs} 次，命中我方 ${p.samples.hits} 次</div>
  <div class="sec-head" style="margin-top:20px"><h2>历史采样记录</h2><span class="sub">每期命中我方的次数</span></div>
  <div class="card" style="display:flex;gap:6px;box-shadow:none">${histBars}</div>

}

function bdAdd(key){
  const map={productLines:'bd-pl-new', competitors:'bd-comp-new', facts:'bd-fact-new'};

function editView(){
  const isOps = IDENTITY==='ops';
  const inputDraftHidden = SVC_MODE==='managed' && !INPUT_DRAFT_SUBMITTED && !isOps;
  const promptDraftHidden = SVC_MODE==='managed' && !PROMPTLIB_DRAFT_SUBMITTED && !isOps;
  const pendingInputs = inputDraftHidden? 0 : (BRAND.competitors.filter(c=>c.st==='pending').length + topics.filter(t=>t.st==='pending').length);
  const pendingPersonas = personas.filter(p=>p.st==='pending' && (isOps || SVC_MODE==='self' || PERSONA_DRAFT_SUBMITTED[p.id])).length;
  const pendingPrompts = promptDraftHidden? 0 : promptLib.filter(p=>p.st==='pending').length;
  const pendingCount = pendingInputs+pendingPersonas+pendingPrompts;
  const parts=[];
  if(pendingInputs) parts.push(pendingInputs+'项输入/主题');
  if(pendingPersonas) parts.push(pendingPersonas+'个人设');
  if(pendingPrompts) parts.push(pendingPrompts+'条提问');
  const pendingStrip = pendingCount? `<div class="pending-strip">
    <span style="flex:1"><b>${pendingCount} 项待确认</b> — ${parts.join('、')}</span>
    <button class="btn sm primary" onclick="jumpFirstPending()">逐项处理</button></div>` : '';

  const tabs = `<div class="seg-sm" style="margin-bottom:18px">
    <button class="${CFG_TAB==='inputs'?'on':''}" onclick="setCfgTab('inputs')">输入底座${pendingInputs?` (${pendingInputs})`:''}</button>
    <button class="${CFG_TAB==='personas'?'on':''}" onclick="setCfgTab('personas')">买家人设${pendingPersonas?` (${pendingPersonas})`:''}</button>
    <button class="${CFG_TAB==='prompts'?'on':''}" onclick="setCfgTab('prompts')">提问库${pendingPrompts?` (${pendingPrompts})`:''}</button>
  </div>`;

  let body='';

    body = brandSummary();
  } else if(CFG_TAB==='personas'){
    const visiblePersonas = isOps ? personas : personas.filter(p=> !(SVC_MODE==='managed' && p.st==='pending' && !PERSONA_DRAFT_SUBMITTED[p.id]));
    body = `<div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${visiblePersonas.map(personaConfigCard).join('')}</div>
    <div style="margin-top:14px"><button class="btn sm" onclick="openAddPersonaModal()">＋ AI生成新人设</button></div></div>`;
  } else {
    const showSubmitBtn = isOps && SVC_MODE==='managed' && !PROMPTLIB_DRAFT_SUBMITTED && promptLib.some(p=>p.st==='pending');
    const visiblePrompts = promptDraftHidden ? promptLib.filter(p=>p.st!=='pending') : promptLib;
    body = `<div class="card">${showSubmitBtn?`<div class="pending-strip"><div class="tiny">低证据提问客户尚不可见，处理完点提交</div><button class="btn sm primary" onclick="submitPromptlibDraft()">提交给客户 →</button></div>`:''}
    <table class="tbl"><thead><tr><th style="width:24px"></th><th>提问</th><th>人设</th><th>证据</th><th>状态</th></tr></thead><tbody>
    ${visiblePrompts.map((p)=>{const i=promptLib.indexOf(p); return `<tr class="${p.st==='pending'?'changed':''}"><td><span class="checkbox ${p.st==='ok'?'on':''}" onclick="togglePromptLib(${i})">${p.st==='ok'?'✓':''}</span></td><td style="font-weight:600">${p.q}</td><td class="tiny">${(personas.find(x=>x.id===p.pid)||{}).name||''}</td>

    </tbody></table>
    <div style="margin-top:14px"><button class="btn sm" onclick="openAddPromptModal()">＋ 手动新增</button></div></div>`;
  }
  return pendingStrip + tabs + body;
}

    action:()=>{ setModule('track'); VIEW='config'; CFG_MODE='edit'; CFG_TAB='inputs'; render(); openBrandEditModal(); }}); }
  const topicPending = topics.filter(t=>t.st==='pending');
  if(topicPending.length){ const isDraft = SVC_MODE==='managed' && !INPUT_DRAFT_SUBMITTED;
  items.push({kind:'主题识别', time:'今天', isDraft, priority:'P1',
    title:`AI新识别 ${topicPending.length} 个主题：${topicPending.map(t=>t.name).join('、')}`,
    body:'基于产品线与人设决策因子，识别出尚未纳入监测的品类话题。',
    reviewed: SVC_MODE==='managed' && !isDraft, needsAction:true, need:'确认是否纳入监测主题',
    action:()=>{ setModule('track'); VIEW='config'; CFG_MODE='edit'; CFG_TAB='inputs'; render(); }}); }
  personas.filter(p=>p.st==='pending').forEach(p=>{
    const isDraft = SVC_MODE==='managed' && !PERSONA_DRAFT_SUBMITTED[p.id];
    items.push({kind:'人设与提问集', time:'今天', pid:p.id, isDraft, priority:'P0',
      title:`识别到新买家角色「${p.name}」，已生成配套监测提问`,
      body:`从近期访客行为与官网询盘线索中，识别出一个此前未覆盖的买家角色（${p.mkt}市场），并已生成配套监测提问。`,
      reviewed: SVC_MODE==='managed' && !isDraft, needsAction:true, need:'确认新增人设，并勾选需要保留的提问',
      action:()=>{ setModule('track'); VIEW='config'; CFG_MODE='edit'; CFG_TAB='personas'; render(); }});
  });
  const promptPending = promptLib.filter(p=>p.st==='pending');
  if(promptPending.length){ const isDraft = SVC_MODE==='managed' && !PROMPTLIB_DRAFT_SUBMITTED;
  items.push({kind:'提问库', time:'今天', isDraft, priority:'P1',
    title:`${promptPending.length} 条提问证据不足，待确认是否入库`,
    body:'新生成的提问未达到2项独立证据门槛，默认不自动入库。',
    reviewed: SVC_MODE==='managed' && !isDraft, needsAction:true, need:'确认是否手动采纳入库',
    action:()=>{ setModule('track'); VIEW='config'; CFG_MODE='edit'; CFG_TAB='prompts'; render(); }}); }
  return items;
}
function overviewWorkBlock(){
  const allItems = buildOverviewWorkItems();
  const isOps = IDENTITY==='ops';
  const visible = isOps ? allItems : allItems.filter(i=>!i.isDraft);     // 客户看不到还在草稿态的东西
  const pending = visible.filter(i=>i.needsAction && !i.isDraft).sort((a,b)=>a.priority==='P0'?-1:b.priority==='P0'?1:0);
  window._ovActions = pending.map(i=>i.action);
  const THRESHOLD = 3;
  const shownPending = pending.slice(0,THRESHOLD);
  const overflowPending = pending.length - shownPending.length;

  const prioBadge = p => p==='P0'? '<span class="badge risk">P0</span>' : '<span class="badge gold">P1</span>';
  const card = (w,i)=>`<div class="workcard">
    <div class="workcard-top">
      <div><div class="workcard-tags">${w.priority?prioBadge(w.priority):''}<span class="badge teal">${w.kind}</span></div><div class="wtitle">${w.title}</div></div>
      ${w.needsAction?`<span class="badge gold">${isOps?'等待客户确认':'待你确认'}</span>`:`<span class="tiny muted">${w.time} · 已处理</span>`}
    </div>
    <div class="wtrack">
      <div class="wt-node"><span class="wt-dot"></span><div><div class="wt-who">GEO 智能体</div><div class="wt-note">${w.body}</div></div></div>
      ${w.reviewed?`<div class="wt-node"><span class="wt-dot ops"></span><div><div class="wt-who">运营顾问<span class="tag">已复核</span></div><div class="wt-note">${w.pid&&PERSONA_SUBMIT_NOTE[w.pid]?PERSONA_SUBMIT_NOTE[w.pid]:'已核对结论与依据，可直接采用'}</div></div></div>`:''}
    </div>
    ${w.needsAction? (isOps
      ? `<div class="wneed"><b>说明：</b>这是客户品牌本身的事实判断（是否是竞对/是否采纳新人设等），只能由客户自己确认，运营顾问在此仅可查看</div>`
      : `<div class="wneed"><b>需要你：</b>${w.need}</div><div class="wact"><button class="btn sm primary" onclick="window._ovActions[${i}]()">去处理 →</button></div>`)
      :''}
  </div>`;

  const confirmSection = `<div class="sec-head" style="margin-top:0"><h2 style="font-size:14px">需要确认</h2><span class="sub">${pending.length?`共 ${pending.length} 项`:'暂无'}</span></div>
    ${shownPending.map((w,i)=>card(w,i)).join('') || `<div class="tiny muted" style="padding:8px 0 4px">暂无待确认事项</div>`}
    ${overflowPending>0?`<div class="tiny" style="margin:4px 0 8px">还有 ${overflowPending} 项优先级较低的事项，<button class="linkbtn" onclick="setModule('diag')">在诊断与策略中查看全部 →</button></div>`:''}`;

  return `<div class="sec"><div class="sec-head"><h2>② GEO智能体做了什么 · 需要你确认</h2><span class="sub">先看做了什么，再看需要确认的事项；进行中的事项见下方③</span></div>
  <div class="card">${confirmSection}</div>
  </div>`;
}
function submitPersonaDraft(pid){
  const p=personas.find(x=>x.id===pid);
  PERSONA_SUBMIT_NOTE[pid] = personaConfirmNote(p);
  PERSONA_DRAFT_SUBMITTED[pid]=true; render(); toast('已提交给客户确认：'+PERSONA_SUBMIT_NOTE[pid]);
}

/* ============ 报告与设置 ============ */
let REPORT_TAB='center';
function reportModule(){
  return `<div class="pagehead"><div><h1>报告与设置</h1><div class="desc">正式报告归档，以及监测引擎/口径/额度/权限的账户级设置</div></div>
    <div class="seg"><button class="${REPORT_TAB==='center'?'on':''}" onclick="setReportTab('center')">报告中心</button><button class="${REPORT_TAB==='settings'?'on':''}" onclick="setReportTab('settings')">设置</button></div></div>`
  + (REPORT_TAB==='center'? reportCenterView() : reportSettingsView());
}
function setReportTab(t){REPORT_TAB=t;render();}
function reportCenterView(){
  const card = (a,i)=>`<div class="workcard">
    <div class="workcard-top">
      <div><div class="workcard-tags"><span class="badge teal">${i===0?'本期':'历史'}</span></div><div class="wtitle">${a.date} 可见性审计报告</div></div>
      <span class="badge ok">已生成</span>
    </div>
    <div class="tiny muted" style="margin-top:8px">品牌提及率${a.mention}% · 品牌推荐率${a.rec}% · 官网引用率${a.cite}% · 声量份额${a.sov}% · 样本量n=${a.n}</div>
    <div class="wact" style="margin-top:10px"><button class="btn sm" onclick="openAuditDetail(${i})">查看详情</button><button class="btn sm" onclick="toast('（演示）下载PDF——实际导出超出本原型范围')">下载PDF</button><button class="btn sm" onclick="toast('（演示）已复制分享链接')">分享</button></div>
  </div>`;
  return `<div class="sec"><div class="sec-head"><h2>可见性审计报告</h2><span class="sub">按月归档，可下载或分享给团队</span></div>
  ${AUDITS.map(card).join('')}</div>`;
}
function reportSettingsView(){
  const engineRows = Object.keys(ENGINES_ENABLED).map(name=>`<div class="field-row"><div class="k">${name}</div><div class="v"></div>
    <span class="switch ${ENGINES_ENABLED[name]?'on':''}" onclick="toggleEngine('${name}')"><span class="knob"></span></span></div>`).join('');
  return `<div class="sec"><div class="sec-head"><h2>引擎</h2><span class="sub">开启后纳入采样，关闭的引擎不产生数据也不计费</span></div>
    <div class="card">${engineRows}</div></div>
  <div class="sec"><div class="sec-head"><h2>采集口径</h2><span class="sub">全景审计与哨兵快照的执行频率</span></div>
    <div class="card">
      <div class="field-row"><div class="k">全景审计频率</div><div class="v"><select class="inp" style="max-width:180px" onchange="setFreq('audit',this.value)"><option ${COLLECT_FREQ.audit==='每月1次'?'selected':''}>每月1次</option><option ${COLLECT_FREQ.audit==='每两周1次'?'selected':''}>每两周1次</option></select></div></div>
      <div class="field-row"><div class="k">哨兵快照频率</div><div class="v"><select class="inp" style="max-width:180px" onchange="setFreq('sentinel',this.value)"><option ${COLLECT_FREQ.sentinel==='每日1次'?'selected':''}>每日1次</option><option ${COLLECT_FREQ.sentinel==='不启用'?'selected':''}>不启用</option></select></div></div>
      <div class="tiny muted" style="margin-top:8px">完整采样规则说明见「可见性监测 › 采样与可信度」</div>
    </div></div>
  <div class="sec"><div class="sec-head"><h2>市场 / 竞对 / 提示词</h2><span class="sub">数据本体在监测配置里维护，这里只做摘要</span></div>
    <div class="card">
      <div class="field-row"><div class="k">目标市场</div><div class="v">${BRAND.market}</div><button class="btn sm" onclick="setModule('track');VIEW='config';CFG_MODE='edit';CFG_TAB='inputs';render()">管理 →</button></div>
      <div class="field-row"><div class="k">竞争对手</div><div class="v">${BRAND.competitors.map(c=>c.name).join(' · ')}</div><button class="btn sm" onclick="setModule('track');VIEW='config';CFG_MODE='edit';CFG_TAB='inputs';render()">管理 →</button></div>
      <div class="field-row"><div class="k">监测提问</div><div class="v">${promptLib.length} 条</div><button class="btn sm" onclick="setModule('track');VIEW='config';CFG_MODE='edit';CFG_TAB='prompts';render()">管理 →</button></div>
    </div></div>
  <div class="sec"><div class="sec-head"><h2>用量与套餐</h2></div>
    <div class="card"><div class="field-row"><div class="k">当前套餐</div><div class="v"><span class="badge teal">${QUOTA.tier}</span></div><button class="btn sm primary" onclick="toast('（演示）跳转升级套餐页')">升级套餐</button></div>
      <div style="margin-top:4px"><div class="tiny">${QUOTA.used} / ${QUOTA.total} ${QUOTA.unit}</div><div class="quota-bar"><i style="width:${QUOTA.used/QUOTA.total*100}%"></i></div><div class="tiny muted" style="margin-top:6px">${QUOTA.renew}</div></div>
    </div></div>
  <div class="sec"><div class="sec-head"><h2>权限与按钮控制</h2><span class="sub">不同套餐能看到/点到哪些功能</span></div>
    <div class="card"><table class="tbl perm"><thead><tr><th>功能</th>${TIERS.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>
    ${PERMISSION_MATRIX.map(row=>`<tr><td>${row[0]}</td>${row.slice(1).map(v=>`<td class="tiny">${v}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
}
function toggleEngine(name){ ENGINES_ENABLED[name]=!ENGINES_ENABLED[name]; render(); toast((ENGINES_ENABLED[name]?'已开启 ':'已关闭 ')+name); }
function setFreq(k,v){ COLLECT_FREQ[k]=v; render(); toast('已更新'+(k==='audit'?'全景审计':'哨兵快照')+'频率为'+v); }

function setView(v){VIEW=v;render();}
const NAV_ITEMS = [['overview','概览'],['track','可见性监测'],['diag','诊断与策略'],['studio','优化中心'],['report','报告与设置']];
function setModule(m){
  if(m==='diag'||m==='studio'){ toast('该模块尚未设计（演示范围外）'); return; }
  MODULE=m; render();
}
function renderNavSub(){
  document.getElementById('navSub').innerHTML = NAV_ITEMS.map(([id,label])=>
    `<div class="s-item ${MODULE===id?'on':''}" onclick="setModule('${id}')">${label}</div>`).join('');
  document.getElementById('crumb').textContent = 'GEO 智能体 / ' + (NAV_ITEMS.find(n=>n[0]===MODULE)||[,''])[1];
}
function setSvcMode(m){ SVC_MODE=m; if(m==='self') IDENTITY='customer'; render(); }
function setIdentity(id){ if(SVC_MODE==='self') return; IDENTITY=id; render(); }
function renderModeBar(){
  document.getElementById('modeBar').innerHTML = `演示切换（实际由账户信息决定，非用户可操作项）：
    <span>服务模式</span>
    <span class="seg"><button class="${SVC_MODE==='self'?'on':''}" onclick="setSvcMode('self')">自助</button><button class="${SVC_MODE==='managed'?'on':''}" onclick="setSvcMode('managed')">代运营</button></span>
    <span>身份</span>
    <span class="seg" ${SVC_MODE==='self'?'disabled':''}><button class="${IDENTITY==='customer'?'on':''}" onclick="setIdentity('customer')">客户</button><button class="${IDENTITY==='ops'?'on':''}" onclick="setIdentity('ops')">运营顾问</button></span>
    ${SVC_MODE==='self'?'<b>该账户为自助模式，没有运营顾问角色</b>':''}`;
}
function trackModule(){
  return pageHead() + (VIEW==='result'? resultView() : configView());
}
function render(){
  renderNavSub();
  renderModeBar();
  const fn = {overview:overviewModule, track:trackModule, report:reportModule}[MODULE] || overviewModule;
  document.getElementById('main').innerHTML = fn();
}
render();
</script>
</body>
</html>
